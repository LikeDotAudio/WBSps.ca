2.png"}, "t6303": {"id": "t6303", "name": "T6303 \u00b7 10 terminal-block openGear rear module (2006|39)", "product": "T6303", "year": 2006, "family": "openGear", "summary": "Single-card rear with ten 3-pin Phoenix blocks for balanced audio: two single-ended pairs on the BNC1/BNC2 pins and eight AES pairs. ISS1 (2006|39) had the inputs on the BNC9/BNC10 pins; ISS2 moved them to the top. ISS4 (2012|45) is drawn from its Gerbers.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6303"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6303.png"}, "t6303a": {"id": "t6303a", "name": "T6303A \u00b7 ISS4 production package for the 10-block openGear rear (2013|46)", "product": "T6303A", "year": 2013, "family": "openGear", "summary": "The T6303A folder is the 2013|46 procurement package for the T6303 ISS4 board: BOMs, a PCAD BOM, the pick-and-place file, the Gerbers and two contract-manufacturer quotes. The simulator builds the board from that package alone and checks it against the T6303 netlists.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6303A"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6303a.png"}, "t6304": {"id": "t6304", "name": "T6304 \u00b7 7 BNC + 3 terminal-block openGear rear module (2007|40)", "product": "T6304", "year": 2007, "family": "openGear", "summary": "Single-card rear for the M6206A embedded audio processor: seven BNCs for SDI and AES, three Phoenix blocks for GPI/O and metadata. One issue (2007|40); five BNCs carry an unvalued 0603 resistor across the series inductor.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6304"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6304.png"}, "t6305": {"id": "t6305", "name": "T6305 \u00b7 8 BNC + 2 terminal-block openGear rear module (2007|40)", "product": "T6305", "year": 2007, "family": "openGear", "summary": "Single-card rear for the D6207A Dolby E / AC-3 decoder: eight BNCs for AES in and out, two Phoenix blocks (reserved and metadata). The netlist carries 5n6/3n9/3n3 inductors; the later pick-and-place file loads 4n7 everywhere.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6305"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6305.png"}, "t6306": {"id": "t6306", "name": "T6306 \u00b7 9 BNC + 1 terminal-block openGear rear module (2008|41)", "product": "T6306", "year": 2008, "family": "openGear", "summary": "Single-card rear for the M6202AE SDI disembedder with Dolby E / AC-3 decode: nine BNCs and one Phoenix block for metadata. The netlist still carries the T6301 ID value 5K36; the BOM and PNP fit the allocated 2K21.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6306"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6306.png"}, "t6307": {"id": "t6307", "name": "T6307 \u00b7 7 BNC + 3 terminal-block openGear rear module (2008|41)", "product": "T6307", "year": 2008, "family": "openGear", "summary": "Single-card rear for the M6205 embedded audio processor: seven BNCs and three Phoenix blocks (two GPI/Os, metadata). The PNP file loads the allocated 1K91; the netlist, edited after the Gerbers, says 5K36 and 4n7.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6307"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6307.png"}, "t6308": {"id": "t6308", "name": "T6308 \u00b7 10-BNC openGear rear module, 8 AES in (2009|42)", "product": "T6308", "year": 2009, "family": "openGear", "summary": "Ten-BNC rear for the M6204A SDI muxer with eight AES inputs: the tenth BNC goes straight to the + leg of the AES4 pair, and the card\u2019s unused SDI OUT2 pin is loaded on the module with 75 \u03a9. The PNP fits an R10 that the netlist does not have.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6308"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6308.png"}, "t6401": {"id": "t6401", "name": "T6401 \u00b7 10-BNC dual-card openGear rear module (2006|39)", "product": "T6401", "year": 2006, "family": "openGear", "summary": "One rear module for two cards: five BNCs each, through P101 and P102. All sixteen AES pins of the two connectors are tied together on the board. Four issues; ISS4 (2012|45) is drawn from its Gerbers, and its PNP still loads the 2006|39 inductor values.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6401"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6401.png"}, "t6402": {"id": "t6402", "name": "T6402 \u00b7 6 BNC + 4 terminal-block dual-card openGear rear (2006|39)", "product": "T6402", "year": 2006, "family": "openGear", "summary": "Dual-card rear for two stereo converters (D6203A A/D or D6204A D/A): three BNCs and two Phoenix blocks per card. ISS1 (2006|39) wired the left-channel block to the right-channel pins and the right-channel block to unused pins.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6402"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6402.png"}, "t6403": {"id": "t6403", "name": "T6403 \u00b7 10 terminal-block dual-card openGear rear (2006|39)", "product": "T6403", "year": 2006, "family": "openGear", "summary": "Dual-card all-audio rear: five Phoenix blocks per card, one single-ended pair (REF IN / IN 1) and four AES pairs. ISS1 (2006|39) put the single-ended block on the BNC9 pins, which no mating card uses; ISS2 moved it to BNC1.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6403"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6403.png"}, "t6406": {"id": "t6406", "name": "T6406 \u00b7 4 \u00d7 9-pin terminal-block dual-card openGear rear (2008|41)", "product": "T6406", "year": 2008, "family": "openGear", "summary": "High-density dual-card audio rear: two 9-pin Phoenix blocks per card, each with one input, three balanced outputs and a ground. Built for two AA6201A analog DAs as dual 2\u00d73. The netlist fits 887R, the T6403 value; the pick-and-place file fits the allocated 604R.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6406"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6406.png"}, "mf6220-frame": {"id": "mf6220-frame", "name": "MF6220 \u00b7 Ward-Beck 20-slot openGear frame (2006|39)", "product": "MF6220 - FRAME", "year": 2006, "family": "openGear", "summary": "Ward-Beck's own 2RU, 20-slot openGear frame: a midplane with a slot-ID resistor ladder and buffered 150 \u03a9 reference to every slot, a five-fan alarm door and a rear reference/comms board. Two hot-swap supplies, a Ross FINC in slot 21. Obsolete.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: commissioning the frame"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Addressing code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mf6220-frame.png"}, "pod1-pod18-redesign": {"id": "pod1-pod18-redesign", "name": "POD1\u2013POD18 redesign (RD64) \u00b7 one SMT board family for two products (2013|46)", "product": "POD1\u2013POD18 redesign (RD64)", "year": 2013, "family": "POD series", "summary": "R&D project that merged POD1 and POD18 onto one SMT main board with plug-in bal\u2192unbal and unbal\u2192bal sub-boards, and replaced their transformers with universal-input supplies. The model lets you switch build, sub-boards and supply and see levels, headroom and ripple change.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the RD64 study"], ["second", "One second, per supply"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod1-pod18-redesign.png"}, "pod1": {"id": "pod1", "name": "POD1 \u00b7 bi-directional balanced/unbalanced audio interface (2013|46)", "product": "POD1", "year": 2013, "family": "POD series", "summary": "Half-rack analog interface with two stereo paths: balanced XLR in to consumer RCA out, and RCA in to balanced XLR out, each with front OUTPUT ADJUST trims. ISS2/ISS3 is an SMT redesign on a main board plus POD1-2 (SSM2143 + NE5532) and POD1-3 (NE5532) sub-boards.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: lining up a POD1"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod1.png"}, "pod10a": {"id": "pod10a", "name": "POD10A \u00b7 8-input AES switcher, 8\u00d71 or dual 4\u00d71 (2013|46)", "product": "POD10A", "year": 2013, "family": "POD series", "summary": "Half-rack AES3 switcher: eight transformer-balanced inputs to two outputs, as one 8\u00d71 or two 4\u00d71 switchers chosen by a front slide. A PIC16F887 enables one DS75176 line receiver per bus and lights the matching button; nothing re-clocks the audio. Three firmware generations are emulated (V030100, V5, V030200) with the CONTROL link to a PC app, a second unit or the POD10R remote.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD10A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod10a.png"}, "pod11a": {"id": "pod11a", "name": "POD11A \u00b7 stereo loudness meter, VU/PPM LED bars + phase (2014|47)", "product": "POD11A", "year": 2014, "family": "POD series", "summary": "Half-rack AES-input stereo meter with two 57-segment bars (VU and peak ranges), a phase meter and LOCK/ERROR tallies, set up by a rear DIP switch. Only the panels survive, so the metering uses the SLM-1 SHARC code (VU, PPM, peak, phase) from the POD3A folder; the year comes from the 2014 silk date.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: reading a POD11A"], ["second", "One second, sample by sample"], ["block", "Block diagram"], ["schematic", "Schematics (algorithm)"], ["software", "Software (SLM-1)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod11a.png"}, "pod12a": {"id": "pod12a", "name": "POD12A \u00b7 AES digital audio DA, 1\u00d78 or dual 1\u00d74 (2013|46)", "product": "POD12A", "year": 2013, "family": "POD series", "summary": "Half-rack AES/EBU distribution amplifier: one input to eight outputs or two inputs to four each, with optional sample-rate conversion (AD1895) and cable equalisation (EL5263), in 75 \u03a9 BNC or 110 \u03a9 Phoenix versions. CS8416 receivers, an EP1C3 FPGA and an AT90CAN128 MCU.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using a POD12A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod12a.png"}, "pod13a": {"id": "pod13a", "name": "POD13A \u00b7 dual AES/EBU D/A converter (2008|41)", "product": "POD13A", "year": 2008, "family": "POD series", "summary": "Half-rack dual AES/EBU to analog converter with 75 \u03a9 BNC and 110 \u03a9 Phoenix inputs, LOCK/NO LOCK tallies and a rear CAL DIP switch (\u221220/\u221218/\u221212 dBFS = +4 dBu). CS8416 receivers, a LatticeXP FPGA and AK4396 DACs feed balanced NE5532 line drivers.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up a POD13A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod13a.png"}, "pod14b-unbalance-in": {"id": "pod14b-unbalance-in", "name": "POD14B \u00b7 analog-to-AES converter, unbalanced input (2014|47)", "product": "POD14B - UNBALANCE IN", "year": 2014, "family": "POD series", "summary": "Half-rack dual analog-to-AES converter: an unbalanced RCA input with front gain trims plus a balanced Phoenix input, 32\u2013192 kHz from an internal PLL or an external AES reference. Behaviour modelled from the POD14A v100 ATmega128 firmware it shares.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using a POD14B"], ["second", "One second, pass by pass"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software (POD14A v100)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod14b-unbalance-in.png"}, "pod15a": {"id": "pod15a", "name": "POD15A \u00b7 analog video DA with cable EQ and clamp (2014|47)", "product": "POD15A", "year": 2014, "family": "POD series", "summary": "Half-rack composite video distribution amplifier: a looping Hi-Z input, a 0\u2013600 m cable equaliser, a back-porch clamp, a level trim and seven 75 \u03a9 outputs (six rear, one front monitor). Only the panels survive, so the circuit is modelled from the legends and the older POD15 manual (year from the 2014 silk date).", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: installing a POD15A"], ["second", "One second, line by line"], ["block", "Block diagram"], ["schematic", "Schematics (inferred)"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod15a.png"}, "pod17": {"id": "pod17", "name": "POD17 \u00b7 AES gain-control DA with SRC (2000|33)", "product": "POD17", "year": 2000, "family": "POD series", "summary": "Half-rack 1-in / 6-out AES distribution amplifier that trims or fades the level of the AES stream, sums to mono, inverts the right channel and converts to a reference sample rate. A PIC16C73A polls the panel and drives two CS8420s; an ADSP-21061 SHARC applies the gain sample by sample.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD17"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod17.png"}, "pod18": {"id": "pod18", "name": "POD18 \u00b7 quad audio interface, 4 \u00d7 unbalanced \u2192 balanced (2013|46)", "product": "POD18", "year": 2013, "family": "POD series", "summary": "Half-rack four-channel interface. Each consumer RCA input becomes a balanced XLR output through an NE5532 gain stage and a unity inverter, with a front OUTPUT ADJUST trim per channel. The through-hole Issues 2/3 use a transformer and LM317/LM337 supply; it was later rebuilt on the RD64 SMT boards.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: lining up a POD18"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod18.png"}, "pod19": {"id": "pod19", "name": "POD19 \u00b7 SDI \u2192 AES de-embedder, one group of four (2001|34)", "product": "POD19", "year": 2001, "family": "POD series", "summary": "Half-rack SDI audio de-embedder. A front step switch picks one of four embedded audio groups, which comes out as two AES3 signals on XLR and BNC, with a re-clocked SDI loop-through. Two PICs are emulated pass by pass: the PODXX user interface (switch, LEDs, 93LC66 EEPROM) and the Demux-1 module that programs a Gennum GS9023.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD19"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod19.png"}, "pod2": {"id": "pod2", "name": "POD2 \u00b7 6\u00d71 stereo audio switcher with SUM and AFV (2009|42)", "product": "POD2", "year": 2009, "family": "POD series", "summary": "Half-rack unity-gain 6\u00d71 stereo analog switcher: twelve 74HC4053s put balanced inputs onto NE5532 summing amplifiers, so a SUM mode can mix any of the six. A PIC16F874 (assembly, v200/v201) polls the buttons, answers an RS-422 protocol at 9600 baud and links to a POD9/21/30 video switcher over SPI for audio-follow-video.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD2"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod2.png"}, "pod20": {"id": "pod20", "name": "POD20 \u00b7 serial digital video DA, cable EQ + reclocking, 1 \u00d7 6 (2000|33)", "product": "POD20", "year": 2000, "family": "POD series", "summary": "Half-rack SD serial digital video distribution amplifier: CLC014 adaptive cable equalizer, CLC016 multi-rate reclocker (143/177/270/360 Mb/s) and two CLC007 drivers feeding six 75 \u03a9 outputs, with lock and rate tallies. Modelled from the ISS2 netlist (2000) and manual.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: installing a POD20"], ["second", "One second, line by line"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod20.png"}, "pod21": {"id": "pod21", "name": "POD21 \u00b7 6\u00d71 SDI video switcher with audio-follow-video (2002|35)", "product": "POD21", "year": 2002, "family": "POD series", "summary": "A half-rack 6\u00d71 serial digital video switcher: six CLC014 equalisers, a CLC018 crosspoint, a CLC016 retimer and a PIC16F874 that scans seven lit buttons. It slaves a POD2 or POD10 audio switcher over SPI for audio-follow-video and takes RS-485 commands from the POD21R remote or a PC. This model runs the v1.01 assembly and the r2.00 remote pass by pass.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD21"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod21.png"}, "pod22a": {"id": "pod22a", "name": "POD22A \u00b7 stereo loudness meter, AES or analog in (2014|47)", "product": "POD22A", "year": 2014, "family": "POD series", "summary": "Half-rack stereo meter with two 57-point VU/peak bars, a phase column and LOCK/COM/44.1K/48K/96K/ERROR tallies, fed from AES (75 or 110 \u03a9, auto-detected) or analog, and remote-controllable from a POD23. Only panels are in its folder; the PIC control code (POD22 v1.02) and a POD22 test report were found filed under POD23 and POD21.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: reading a POD22A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics (pins from code)"], ["software", "Software (POD22 PIC)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod22a.png"}, "pod23": {"id": "pod23", "name": "POD23 \u00b7 leveller remote control panel for DA305A / POD22 (2004|37)", "product": "POD23", "year": 2004, "family": "POD series", "summary": "Half-rack remote panel with no audio inside: six push-and-turn knobs and 4-character SLG2016 displays set level, target, ratio, range, threshold, peak limit and output modes on up to ten DA305A leveller DAs over RS-485. The POD23A v100 firmware (PIC16F877) is emulated pass by pass, with its display bus, its 9600-baud frames and a replying DA305A; the 2003 two-knob POD23 for the POD22 meter is modelled too.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD23A"], ["second", "One second, broken down"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod23.png"}, "pod24": {"id": "pod24", "name": "POD24 \u00b7 10 W stereo monitor power amplifier (2014|47)", "product": "POD24", "year": 2014, "family": "POD series", "summary": "Half-rack stereo monitor amplifier: balanced XLR inputs, screwdriver level trims with a STEREO-link lever, and two TDA2616s driving bridged speaker outputs. Modelled from the ISS2 netlist; the year is the panel silk date.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up a POD24"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod24.png"}, "pod25": {"id": "pod25", "name": "POD25 \u00b7 Stereo silence detector (2003|36)", "product": "POD25", "year": 2003, "family": "POD series", "summary": "Half-rack two-channel analog silence detector: green PRESENCE and red ALARM LEDs per channel, a beeper with a mute button and three DPDT GPI relays (channel 1, channel 2, either). A PIC16F73 at 4.9152 MHz runs one polling loop that samples two rectified audio levels and the delay trimmer; this model runs that loop pass by pass, cycle-counted from the MPASM source.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD25"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod25.png"}, "pod26": {"id": "pod26", "name": "POD26 \u00b7 six-channel audio level amplifier (2014|47)", "product": "POD26", "year": 2014, "family": "POD series", "summary": "Half-rack six-in, six-out balanced audio level amplifier with a front screwdriver trim per channel (\u221212 \u2026 +18 dB). Modelled from the ISS1 netlist: twelve NE5532s with a T-network trim, on unregulated rails. The year is the panel silk date.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: lining up a POD26"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod26.png"}, "pod27": {"id": "pod27", "name": "POD27 \u00b7 SDI audio muxer, one AES group into SD-SDI (2003|36)", "product": "POD27", "year": 2003, "family": "POD series", "summary": "Half-rack SD-SDI embedder: two AES inputs (75 \u03a9 BNC or 110 \u03a9 Phoenix, auto-detected) are sample-rate converted to 48 kHz by two CS8420s and embedded as one SMPTE 272M group by a GS9023, with cascade mode and front-panel group select. A PIC16F874 bit-bangs the chips every 2.4 ms; the emulator runs that loop pass by pass for eight firmware builds from v1.00 (2003|36) to V200 (2012|45).", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD27"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod27.png"}, "pod28": {"id": "pod28", "name": "POD28 \u00b7 SD/HD-SDI reclocking distribution amplifier (2003|36)", "product": "POD28", "year": 2003, "family": "POD series", "summary": "Half-rack SDI distribution amplifier: one input, a GS1524 cable equaliser, a GS1535 multi-rate reclocker (143 Mb/s to 1.485 Gb/s) and six GS1528 drivers. A PIC16F874 watches the chips and lights SDI, HD and ERROR. Both archived firmware versions (v1.00 and v1.01) run here instruction by instruction.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD28"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod28.png"}, "pod29": {"id": "pod29", "name": "POD29 \u00b7 four-output 40 W regulated power supply (2014|47)", "product": "POD29", "year": 2014, "family": "POD series", "summary": "Half-rack 40 W dual-rail power supply with four parallel + \u2212 G outputs on pluggable terminals: POD29A (\u00b115 V) or POD29B (\u00b112 V). Only a wiring diagram, a draft manual and panels survive, so the supply module itself is modelled from the manual ratings.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Wiring"], ["software", "Power path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod29.png"}, "pod29l": {"id": "pod29l", "name": "POD29L \u00b7 \u00b124 V / +48 V phantom power supply, XLR-5 outputs (2015|48)", "product": "POD29L", "year": 2015, "family": "POD series", "summary": "POD29 variant with an XLR rear: two 5-pin outputs carrying chassis, +24 V, 0 V, \u221224 V and +48 V phantom. Its sister POD29E puts \u00b112 V on the same panel with pin 5 unused. Only a bottom-plate drawing is in its own folder; the panels come from the POD29X silk and drawings, dated May 2015.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Wiring"], ["software", "Power path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod29l.png"}, "pod30": {"id": "pod30", "name": "POD30 \u00b7 4\u00d71 HD/SD-SDI video switcher (2003|36)", "product": "POD30", "year": 2003, "family": "POD series", "summary": "Half-rack 4\u00d71 SDI switcher: four GS1524 equalisers into a GS1535 reclocker whose 4:1 mux a PIC16F874 flips on line 10 of a NTSC reference. Two outputs, RS-485 remote (F0 + command) and a slave port for audio-follow-video with a POD2 or POD10. The PIC firmware (v1.00 and V020000) is emulated pass by pass.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD30"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod30.png"}, "pod31": {"id": "pod31", "name": "POD31 \u00b7 SD/HD-SDI AES de-embedder with Dolby decoder option (2005|38)", "product": "POD31", "year": 2005, "family": "POD series", "summary": "Half-rack SD/HD-SDI de-embedder: a Cyclone FPGA pulls two DIP-selected audio groups to four AES outputs (BNC and Phoenix), spots Dolby E / AC-3, and can route one pair through a plug-in CAT No. 552 decoder. An ATmega128 bit-bangs the FPGA status every loop pass and runs the 13 status LEDs.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD31"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod31.png"}, "pod32": {"id": "pod32", "name": "POD32 \u00b7 SD/HD-SDI AES embedder with SRC (2010|43)", "product": "POD32", "year": 2010, "family": "POD series", "summary": "Half-rack SD/HD-SDI audio embedder: four external AES inputs, each through an AD1895 sample-rate converter or straight in, are written into audio groups 1\u20134 of the video, chosen by 16 rear DIP switches. A Cyclone II with PugMedia SMPTE 272M/299M encoder cores does the audio; an ATmega128 debounces the DIPs, sequences the FPGA reset and drives the LEDs. The v100 firmware is emulated pass by pass.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD32"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod32.png"}, "pod34": {"id": "pod34", "name": "POD34 \u00b7 2 \u00d7 15 W stereo power amplifier, AES + analog in (2015|48)", "product": "POD34", "year": 2015, "family": "POD series", "summary": "Half-rack stereo power amplifier fed from AES (with loop-out) or balanced analog inputs, with linked or separate level knobs, a LOCK LED and a headset jack. Only a preliminary spec sheet, panels and a wiring drawing survive; internals are inferred.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up a POD34"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Wiring (inferred)"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod34.png"}, "pod3a": {"id": "pod3a", "name": "POD3A \u00b7 Analog stereo loudness meter (2004|37)", "product": "POD3A", "year": 2004, "family": "POD series", "summary": "Half-rack stereo meter: balanced analog inputs feed an ADC and an ADSP-21065L SHARC, which drives two multiplexed 57-LED bars (VU bar + PPM dot, \u221252\u2026+20) and a 9-LED phase column. The \"SLM-1 Analog\" SHARC project in the folder, and its 2004 EPROM image, are POD3A's own firmware; the 2002 manual describes the older analog POD3.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD3A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod3a.png"}, "pod4": {"id": "pod4", "name": "POD4 \u00b7 dual microphone preamplifier with mix (2006|39)", "product": "POD4", "year": 2006, "family": "POD series", "summary": "Half-rack dual mic preamp: SSM2017 front ends with switchable 48 V phantom, DIRECT and mutable SWITCHED balanced outputs per mic, and a knob-controlled MIX of the switched outputs. Modelled from the ISS4 netlist (2006) with both the P-CAD and the production BOM values.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up a POD4"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod4.png"}, "pod5": {"id": "pod5", "name": "POD5 \u00b7 dual stereo headset amplifier with talkback (2014|47)", "product": "POD5", "year": 2014, "family": "POD series", "summary": "Half-rack dual stereo headset amplifier. Grounding a rear control puts the talkback input in the right ear and a mono sum of the program in the left. Modelled from the ISS4 netlist: CMOS switches at virtual earths, dual-pot level, discrete class-AB headset drivers. The year is the panel silk date.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using a POD5"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod5.png"}, "pod7": {"id": "pod7", "name": "POD7 \u00b7 Universal GPI interface (1997|30)", "product": "POD7", "year": 1997, "family": "POD series", "summary": "Half-rack control interface: 8 logic/opto inputs mapped in software to 10 open-collector outputs and 4 two-pole relays, plus a switchable 2 W speaker amp. The archived PIC assembly \u2014 the standard v1.00\u2013v1.03 line and the 024, CTV, 040 and 047 customs \u2014 is assembled and run instruction by instruction at 4.9152 MHz.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD7"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod7.png"}, "pod8a": {"id": "pod8a", "name": "POD8A \u00b7 analog audio DA, 2 in / 16 out (2015|48)", "product": "POD8A", "year": 2015, "family": "POD series", "summary": "Half-rack analog audio distribution amplifier: inputs A and B, outputs A1\u2013A8 and B1\u2013B8, a trim per output and per input, and a MONO / SUM / STEREO switch. Only panels, a test report and quotes survive, so the circuit inside is inferred.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: distributing with a POD8A"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics (inferred)"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod8a.png"}, "pod9": {"id": "pod9", "name": "POD9 \u00b7 6\u00d71 analog video switcher with VI switching and AFV (1998|31)", "product": "POD9", "year": 1998, "family": "POD series", "summary": "Half-rack 6\u00d71 composite video selector: two 4:1 video multiplexers feed an OPA650 with two 75 \u03a9 outputs, and an LM1881 on the output tells the PIC when the vertical interval comes. The PIC (assembly, V1.02) polls the buttons, answers RS-422 at 9600 baud and is the SPI master of a POD2 or POD10 audio switcher for audio-follow-video.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD9"], ["second", "One second, field by field"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod9.png"}, "ams2": {"id": "ams2", "name": "AMS2 \u00b7 1RU stereo powered speaker monitor (2015|48)", "product": "AMS2", "year": 2015, "family": "Monitors, meters & tools", "summary": "A 1RU stereo monitor with built-in speakers. It plays a balanced analog pair or an AES pair; the AMS2-N variant adds a uNet AES67 network receiver. Inside, the QubeAmp \u201cUniversal Amplifier Board\u201d runs a CS8416 and PCM5100A, an NE5532 mixer, and a TPA3124D2 class-D stage at 36 dB.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path & network config"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ams2.png"}, "ams4": {"id": "ams4", "name": "AMS4 \u00b7 4-input audio monitor switcher (2002|35)", "product": "AMS4", "year": 2002, "family": "Monitors, meters & tools", "summary": "1RU monitor: four stereo analog and four AES inputs (75 \u03a9 or 110 \u03a9, found automatically), an optional SDI de-embedder, a 10-LED stereo VU meter with phase indicator, speakers and a headset jack. A PIC16F874 runs it from a polled main loop; this model replays that loop pass by pass for every firmware version from v2.00 to V5.00, plus the AMS4N and AMS4E variants.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the AMS4"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ams4.png"}, "ams8e": {"id": "ams8e", "name": "AMS8E \u00b7 AMS8 board-set production masters (2012|45)", "product": "AMS8E boards", "year": 2012, "family": "Monitors, meters & tools", "summary": "The AMS8E boards are the shared hardware of the AMS8 monitors and their descendants: the AMS8E-1 SHARC/FPGA main board, the AMS8E-4 LED meter board, the AMS8E-5 control board and the AMS8E-8 speaker amp. The boards are drawn from their Gerbers and placed on a test bench. The meter multiplex and the amplifier follow the firmware and the archive\u2019s test sheets.", "depth": "Hardware model", "tabs": [["sim", "Simulator (test bench)"], ["tutorial", "Tutorial: build and test"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path & programs"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ams8e.png"}, "rd-hardwareimprovements": {"id": "rd-hardwareimprovements", "name": "RD Hardware Improvements \u00b7 parts-sourcing study (2012|45)", "product": "RD - HardwareImprovements", "year": 2012, "family": "R&D register", "summary": "Engineering\u2019s 2011\u20132012 component study: two outside boards tabulated part by part, a shortlist of regulators, clocks, SDI and audio parts, and an oscillator quote. The model redraws the studied board, chains the SDI-to-audio parts, and runs the LDO, buck, VCXO and cable-reach numbers from the datasheets.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the parts study"], ["second", "One second of clocks"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd-hardwareimprovements.png"}, "rd10-cycloneiv": {"id": "rd10-cycloneiv", "name": "RD10 Cyclone IV \u00b7 FPGA adoption and power-on model (2011|44)", "product": "RD10 Cyclone IV", "year": 2011, "family": "R&D register", "summary": "Peter\u2019s 2011 evaluation of the Altera Cyclone IV E: price, logic, pins, configuration flash and clocking, followed into the AMS16-3G, the AMS8E-1 iss5 board (AMS81 family) and the MLC8N. Power the boards up in slow motion: the ATmega128 boot code, the Active Serial read of the M25P16 bit by bit, CONF_DONE, user mode and PLL lock.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the investigation"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd10-cycloneiv.png"}, "rd13-timinganalysis": {"id": "rd13-timinganalysis", "name": "RD13 Timing Analysis \u00b7 TimeQuest/SDC lab and the products it constrained (2010|43)", "product": "RD13 Timing Analysis", "year": 2010, "family": "R&D register", "summary": "Peter\u2019s September 2010 TimeQuest course, run on its real lab files. Toggle each line of his top.sdc, compare it with Altera\u2019s solution, and watch clocks, slack and clock domains change on the PLL-driven time-multiplexed multiplier. The same commands are then traced into the POD32, M6205, AMS16 and AMS81 SDC files.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the timing lab"], ["second", "One second, cycle by cycle"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd13-timinganalysis.png"}, "rd18-pcbdesigner": {"id": "rd18-pcbdesigner", "name": "RD18 PCB Designer \u00b7 termination and stack-up study (2012|45)", "product": "RD18 PCB Designer", "year": 2012, "family": "R&D register", "summary": "Peter\u2019s 2011\u20132012 PCB and signal-integrity self-study, run as a working bench: a clock line with selectable termination solved in the time domain, his AC-termination rule checked live, a stack-up per his layer notes, and the ground-loop hum he wrote about.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the termination study"], ["second", "One second, edge by edge"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd18-pcbdesigner.png"}, "rd19-hd-bnc": {"id": "rd19-hd-bnc", "name": "RD19 High Density BNC \u00b7 connector density and 3G-SDI echo model (2010|43)", "product": "RD19 HD BNC", "year": 2010, "family": "R&D register", "summary": "A one-line R&D item (Peter, 2010) asking whether WBS rear modules should move to Amphenol high-density BNC. The model compares connectors per openGear slot and frame, and shows what an imperfect 75 \u03a9 connector does to a 3G-SDI eye.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: evaluating HD-BNC"], ["second", "One second, bit by bit"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd19-hd-bnc.png"}, "rd20-veriloghdl": {"id": "rd20-veriloghdl", "name": "RD20 Verilog HDL \u00b7 self-study and the DEMUX-4 Verilog it led to (2011|44)", "product": "RD20 Verilog HDL", "year": 2011, "family": "R&D register", "summary": "Peter\u2019s 2011 Verilog study, simulated: blocking vs non-blocking in a small event scheduler, `timescale rounding, implicit ports, and the WBS Verilog that followed on DEMUX-4 \u2014 the AES3 clock divider and SD clock-enable generator \u2014 run cycle by cycle across one second.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the Verilog study"], ["second", "One second, clock by clock"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd20-veriloghdl.png"}, "rd21-audiolevelloggingnlc": {"id": "rd21-audiolevelloggingnlc", "name": "RD21 NLC loudness logger \u00b7 DTS NLC card + Java \"LumberJack\" logger (2011|44)", "product": "RD21 NLC loudness logger", "year": 2011, "family": "R&D register", "summary": "R&D from 2011: log what the DTS Neural Loudness Control on an M6205A-3G openGear card measures, once a second, on a PC. The model runs the card firmware (LogTask, logman/logcomm, DTS getters over SPI), CAN and the frame bridge, and the Java logger (NTP, WBSLAP request, parser, card10.txt) with timing taken from the 2011 network capture.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: logging an NLC card"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd21-audiolevelloggingnlc.png"}, "rd22-madi": {"id": "rd22-madi", "name": "RD22 MADI \u00b7 AES10 input for the 32ME monitor (2012|45)", "product": "RD22 MADI", "year": 2012, "family": "R&D register", "summary": "The R&D project that brought MADI (AES10, 64 channels on one coax) into the AMS8x monitor platform and became the 32ME. A DirectOut i64 module decodes the 125 Mbit/s link; a Cyclone IV unpacks SMUX1/2/4 into I2S for the SHARC meters and reports dead channels to the ATmega128 over SPI.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the RD22 bench"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd22-madi.png"}, "rd23-ams16-3g": {"id": "rd23-ams16-3g", "name": "RD23 AMS16 3G-SDI upgrade \u00b7 R&D: SD/HD monitor to 3G (2011|44)", "product": "RD23 AMS16-3G", "year": 2011, "family": "R&D register", "summary": "The R&D project that took the AMS16 audio monitor from SD/HD to 3G-SDI: GS1559 \u2192 GS2970A receiver, Cyclone II \u2192 Cyclone IV FPGA, and a new main-board start-up around Gennum SPI through the FPGA. A before/after simulator runs both builds side by side through the dated R&D stages, from first loop-through (Nov 2011) to the v700 release (Oct 2012).", "depth": "Full model", "tabs": [["sim", "Simulator: before / after"], ["tutorial", "Tutorial: doing the upgrade"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings + file hashes"]], "preview": "siumulation-plugins/previews/rd23-ams16-3g.png"}, "rd26-metadata-vanc-inserter": {"id": "rd26-metadata-vanc-inserter", "name": "RD26 Metadata VANC Inserter \u00b7 SMPTE 2020 / RDD 6 study (2011|44)", "product": "RD26 Metadata VANC Inserter", "year": 2011, "family": "R&D register", "summary": "R&D study (Peter/Ali, never built) into carrying Dolby audio metadata in SDI vertical ancillary data. The model builds bit-exact RDD 6 frames, packs them into SMPTE 2020 packets on a legal VANC line, and shows what the WBS M6205C200 card would read back.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the RD26 study"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd26-metadata-vanc-inserter.png"}, "rd29-modularization": {"id": "rd29-modularization", "name": "RD29 Modularization \u00b7 product I/O feature-matrix model (2011|44)", "product": "RD29 Modularization", "year": 2011, "family": "R&D register", "summary": "The 2011 feature matrix of 50 Ward-Beck products against 38 I/O and control types, turned into a module-kit model: which blocks recur, how many products a small kit could build, and which existing product fits a requested stand-alone option.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: modules from the matrix"], ["second", "One second in the product"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd29-modularization.png"}, "rd37-descriptivevideomandate": {"id": "rd37-descriptivevideomandate", "name": "RD37 Descriptive Video Mandate \u00b7 DV audio routing study (2011|44)", "product": "RD37 Descriptive Video Mandate", "year": 2011, "family": "R&D register", "summary": "Regulatory and cost research on the CRTC described-video rules, modelled together with the audio path a station needed: the M6205C200 card\u2019s real DV / programme-mono routing, GPI switching, metadata fold-down and gain ramps.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the DV study"], ["second", "One second, sample by sample"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd37-descriptivevideomandate.png"}, "rd38-serialboxvsopengear": {"id": "rd38-serialboxvsopengear", "name": "RD38 Serial Box vs openGear \u00b7 card cross-reference model (2011|44)", "product": "RD38 Serial Box vs openGear", "year": 2011, "family": "R&D register", "summary": "The December 2011 cross-reference of Serialboxx MF100 cards against Ward-Beck openGear cards, as a working conversion model: load an MF100 rack, see the openGear frame it becomes, and which functions have no openGear card.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: converting a rack"], ["second", "One second, by card type"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd38-serialboxvsopengear.png"}, "rd39-mpeg-heaac": {"id": "rd39-mpeg-heaac", "name": "RD39 MPEG / HE-AAC \u00b7 encoder sizing model (2012|45)", "product": "RD39 MPEG / HE-AAC", "year": 2012, "family": "R&D register", "summary": "The January 2012 study of an HE-AAC v2 encoder, as a working model. Set the bitrate and codec mode to see the AAC/SBR/PS split, frame timing and config string, and check the SHARC memory problem that ended the idea.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: sizing the encoder"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd39-mpeg-heaac.png"}, "rd45-dolbyd-ac3": {"id": "rd45-dolbyd-ac3", "name": "RD45 Dolby Digital (AC-3) \u00b7 metadata chunk model (2012|45)", "product": "RD45 Dolby Digital AC-3", "year": 2012, "family": "R&D register", "summary": "The EBU <dbmd> Dolby metadata chunk as a live editor: set channel format, data rate, downmix and dialnorm, and see the bytes, checksums, AC-3 frame timing and what a decoder does with dialnorm.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: metadata"], ["second", "One second of AC-3"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd45-dolbyd-ac3.png"}, "rd47-analogtosdivideo": {"id": "rd47-analogtosdivideo", "name": "RD47 Analog to SDI video \u00b7 4-channel POD concept (2012|45)", "product": "RD47 Analog to SDI", "year": 2012, "family": "R&D register", "summary": "The 2012 concept for a four-channel analog-to-SDI POD, modelled around the TDA9955HL converter in the folder. Pick inputs on a POD-size rear panel, watch a line being digitised, step through the I\u00b2C set-up, and test the $250 cost target.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: scoping it"], ["second", "One second of video"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd47-analogtosdivideo.png"}, "rd5-incremental-compilation": {"id": "rd5-incremental-compilation", "name": "RD5 Incremental compilation \u00b7 Quartus partition model (2010|43)", "product": "RD5 Incremental Compilation", "year": 2010, "family": "R&D register", "summary": "Peter\u2019s 2010 notes on Quartus incremental compilation, applied to two real Ward-Beck projects: POD31 (which used partitions in 2007) and the flat AMS16A. Edit a block, set netlist types, compile, and compare with the recorded compile times; size a SignalTap buffer.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: partitions"], ["second", "One second / one compile"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd5-incremental-compilation.png"}, "rd50-improvespeakerdesign": {"id": "rd50-improvespeakerdesign", "name": "RD50 Improve speaker design \u00b7 AMS8E-8 bass boost and class-D model (2012|45)", "product": "RD50 Improve Speaker Design", "year": 2012, "family": "R&D register", "summary": "The 2012 attempt to improve the AMS8E monitor speakers. The AMS8E-8 amp board is drawn from its pick-and-place file and modelled from its netlist; switch in the bass-boost values to see the shelf it makes, check clipping headroom, and compare the class-D amplifiers in the folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the speaker study"], ["second", "One second, stage by stage"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd50-improvespeakerdesign.png"}, "rd53-ideviceatodadapter": {"id": "rd53-ideviceatodadapter", "name": "RD53 iDevice A-to-D adapter \u00b7 battery AES generator concept (2012|45)", "product": "RD53 iDevice A-to-D Adapter", "year": 2012, "family": "R&D register", "summary": "Kevin\u2019s October 2012 sketch of a pocket adapter that turns an iPod\u2019s headphone output into AES3, modelled from the sketch. Plug, charge and run down the battery, watch the LED states, and follow a tone from the app to dBFS on the AES output.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: pocket generator"], ["second", "One second of AES"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd53-ideviceatodadapter.png"}, "rd54-inexpensiveswitcher": {"id": "rd54-inexpensiveswitcher", "name": "RD54 Inexpensive switcher \u00b7 openGear matrix concept (2012|45)", "product": "RD54 Inexpensive Switcher", "year": 2012, "family": "R&D register", "summary": "The October 2012 idea of a low-cost switcher on one openGear card with a wide custom rear. Size the rear and matrix, then run takes, locks and renames from three user panels: the multi-user problem the meeting notes called the hard part.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: users and takes"], ["second", "One second of switching"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd54-inexpensiveswitcher.png"}, "rd56-raspberrypi": {"id": "rd56-raspberrypi", "name": "RD56 Raspberry Pi \u00b7 mall signage network concept (2012|45)", "product": "RD56 Raspberry Pi", "year": 2012, "family": "R&D register", "summary": "The October 2012 idea of a Raspberry Pi behind every LCD TV in a mall, controlled from an openGear frame. The flow diagram is redrawn as a working network: add monitors, compare unicast, multicast and uploaded files, switch content, and try the RFID-targeting idea.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: a mall of Pis"], ["second", "One second of signage"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd56-raspberrypi.png"}, "rd57-madi-distributionamplifier": {"id": "rd57-madi-distributionamplifier", "name": "RD57 MADI Distribution Amplifier \u00b7 bench test of WBS DAs with MADI (2012|45)", "product": "RD57 MADI DA", "year": 2012, "family": "R&D register", "summary": "In October 2012 a customer asked whether a Ward-Beck DA could distribute MADI; the analog-video, AES and SDI DAs were all tried and none passed. This model re-runs that bench test, shows why each card rejects a 125 Mbaud MADI stream (down to the M6203A firmware that mutes its outputs), and what a real MADI DA needs.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: repeating the test"], ["second", "One second of MADI"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd57-madi-distributionamplifier.png"}, "rd58-adda-8ch-metering": {"id": "rd58-adda-8ch-metering", "name": "RD58 8-ch A/D + D/A with 16 meters \u00b7 POD-size converter study (2012|45)", "product": "RD58 8+8 converter POD", "year": 2012, "family": "R&D register", "summary": "A December 2012 idea: one \u00bd RU POD with 8 channels of A/D, 8 of D/A and 16 meters, built on the AMS8E-1 main board and AMS8 meter boards. The model sizes the front and rear to scale, runs the levels through the house \u221220 dBFS = +4 dBu alignment, and shows the meters with the real VU ballistics.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: sizing the POD"], ["second", "One second inside"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd58-adda-8ch-metering.png"}, "rd59-ipvideotohdmiconverter": {"id": "rd59-ipvideotohdmiconverter", "name": "RD59 IP Video to SDI/HDMI Converter \u00b7 customer requirement model (2013|46)", "product": "RD59 IP-to-video box", "year": 2013, "family": "R&D register", "summary": "A January 2013 customer request for a box that turns IP camera streams (H.264 + AAC, MJPEG) into SDI, composite and analog audio, managed from a web page and able to reconnect by itself. The model runs a stream through jitter buffer, decoder and frame synchroniser into 480i, 720p or 1080i, and shows what a lost connection does to the picture.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the box"], ["second", "One second through it"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd59-ipvideotohdmiconverter.png"}, "rd60-ams81a-iss5": {"id": "rd60-ams81a-iss5", "name": "RD60 AMS81A on ISS5 \u00b7 AMS8-1A port to the AMS8E-1 issue 5 board (2013|46)", "product": "RD60 AMS81A on ISS5", "year": 2013, "family": "R&D register", "summary": "The 2013|46 R&D job that moved the AMS8-1A monitor from the ISS2/3 main board (EP1C6, EPCS1, four CS8416 + four AD1895 receive chains) to the AMS8E-1 issue 5 board, where a Cyclone IV EP4CE40 does AES receive and sample-rate conversion itself. The simulator replays each build from v100 to V050000 against both real assembly drawings, with the configuration-chip question, the power-up timing and the Dolby-reset fixes.", "depth": "Full model", "tabs": [["sim", "Simulator: before / after"], ["tutorial", "Tutorial: porting to ISS5"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd60-ams81a-iss5.png"}, "rd61-hdmi-player": {"id": "rd61-hdmi-player", "name": "RD61 Small Form Factor HDMI Video Player \u00b7 the USB-key sketch as a working model (2013|46)", "product": "RD61 HDMI player stick", "year": 2013, "family": "R&D register", "summary": "An early-2013 idea for a USB-key-sized HDMI video player, known only from a pencil sketch: USB plug, HDMI plug, a PLAY/STOP button and a LOOP/PLAY ONCE switch. The model makes the sketch work: hot-plug and EDID, playback with loop or stop, and the HDMI frame, line and pixel timing underneath.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the stick"], ["second", "One second of HDMI"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd61-hdmi-player.png"}, "rd63-avbresearch": {"id": "rd63-avbresearch", "name": "RD63 AVB Research \u00b7 Audio Video Bridging sizing and vendor model (2013|46)", "product": "RD63 AVB research", "year": 2013, "family": "R&D register", "summary": "The 2013\u20132014 research into IEEE AVB networked audio for WBS monitors. The model reserves talker streams on a 100 Mb/s or 1 Gb/s link, shows gPTP, shaped AVTP packets and the 2 ms presentation time in slow motion, breaks the cloud with a plain switch, and compares the XMOS and DDC licence routes that led to the RD79 XMOS listener.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: sizing AVB"], ["second", "One second on the link"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd63-avbresearch.png"}, "rd66-mlc8-ams8e1-iss5": {"id": "rd66-mlc8-ams8e1-iss5", "name": "RD66 \u00b7 MLC8 ported to the AMS8E-1 iss5 main board (2013|46)", "product": "RD66 MLC8 on AMS8E-1 iss5", "year": 2013, "family": "R&D register", "summary": "April 2013|46 R&D: the MLC8B (MLC8AM front) moved from the AMS8-1 main board (four CS8416 receivers + AD1895 SRCs) to the AMS8E-1 issue 5 board, where AES receive and SRC live in a Cyclone IV copied from RD60. Only the main Atmel changed (v105 \u2192 v106 = release V050000); the simulator runs before, after and a patch-by-patch workbench side by side.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: doing RD66"], ["second", "One second, counted"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd66-mlc8-ams8e1-iss5.png"}, "rd68-reducingdepthof2ruunits": {"id": "rd68-reducingdepthof2ruunits", "name": "RD68 Reducing Depth of 2RU Units \u00b7 AMS16 12-in \u2192 8-in pan (2013|46)", "product": "RD68 shallower 2RU chassis", "year": 2013, "family": "R&D register", "summary": "The 2013 project to take at least 4 inches out of the AMS16 and share metalwork across the 2RU units. The real bottom-pan hole patterns are drawn to scale: cut the 12-inch pan and see what has to move, then compare it with the 8-inch AMS16-8 pan the project produced and the RD68 prototype hole schedule.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: taking 4 inches out"], ["second", "One second, heat"], ["block", "Block diagram"], ["schematic", "Drawings"], ["software", "Design steps"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd68-reducingdepthof2ruunits.png"}, "rd69-vidbuddy-madibuddy": {"id": "rd69-vidbuddy-madibuddy", "name": "RD69 Vid Buddy / MADI Buddy \u00b7 handheld tester on the Demux4 board (2013|46)", "product": "RD69 Vid/MADI Buddy", "year": 2013, "family": "R&D register", "summary": "An April 2013 scope for a battery handheld that de-embeds SDI and reads MADI, built on the SA-DEMUX4 board for $750 or less. The model puts the Demux4 in an AVB1-sized case, tests its battery life against the 2002 VIDBuddy\u2019s measured hours, costs it from the real Demux4 assembly quote, and shows that the MADI reclocker on Issue 2 was never fitted.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: specifying the Buddy"], ["second", "One second, old vs new"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd69-vidbuddy-madibuddy.png"}, "rd70-microcontrollerresearch": {"id": "rd70-microcontrollerresearch", "name": "RD70 \u00b7 Microcontroller research: Cortex-M + FreeRTOS evaluation (2013|46)", "product": "RD70 Microcontroller Research", "year": 2013, "family": "R&D register", "summary": "The 2013|46 search for a 32-bit successor to the ATmega128: Kinetis, XMEGA, SAM7 and STM32 parts compared, an STM32F100/F103/F407 family picked as Low/Mid/High, and the stock FreeRTOS V7.4.2 STM32F4 demo built in IAR and run on a Discovery board. The plugin runs that demo tick by tick and sets it beside the WBS super-loops and the Ross gearos scheduler.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the evaluation"], ["second", "One second, tick by tick"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd70-microcontrollerresearch.png"}, "rd71-touchdisplay": {"id": "rd71-touchdisplay", "name": "RD71 Touch Display \u00b7 Densitron RipDraw 1U touch TFT evaluation (2015|48)", "product": "RD71 Touch Display", "year": 2015, "family": "R&D register", "summary": "A 2015|48 bench evaluation of a Densitron 480 \u00d7 110 1U touch TFT with its own Cortex-M4 \"RipDraw\" GPU, driven over USB from a BeagleBone Black. The likely target was a replacement for the AMS8-2 8-character displays (RD62). The simulation runs the archived C test programs, byte for byte, against a model of the display.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the evaluation"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd71-touchdisplay.png"}, "rd72-cat1100": {"id": "rd72-cat1100", "name": "RD72 CAT1100 \u00b7 Dolby decoder module evaluation on the AMS8E-1 (2013|46)", "product": "RD72 CAT1100", "year": 2013, "family": "R&D register", "summary": "Dolby withdrew the CAT552 decoder module in 2013 and named the CAT1100 as its replacement. RD72 put the new 100-pin card next to the old SIMM on the AMS8E-1 issue 5 main board. The model runs the ATmega firmware, five FPGA copies and the card\u2019s host interface, from the bench fixture to the half-finished in-chassis integration.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: evaluating the CAT1100"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd72-cat1100.png"}, "rd74-t6301upgradeto3g-sdi": {"id": "rd74-t6301upgradeto3g-sdi", "name": "RD74 T6301 Upgrade to 3G-SDI \u00b7 rear-module cable-reach test (2013|46)", "product": "RD74 T6301 \u2192 3G", "year": 2013, "family": "R&D register", "summary": "June 2013: an M6203A on a T6301 rear reached only 66 m of 3G-SDI cable, because the T6301\u2019s BNC is rated to 1 GHz. The model rebuilds that bench, calibrated to the M6203A test reports (75 m on a Ross 3G rear), so you can swap rear modules, formats and cable and watch the card lock or mute.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the cable test"], ["second", "One second, in and out"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd74-t6301upgradeto3g-sdi.png"}, "rd79-avb-monitor": {"id": "rd79-avb-monitor", "name": "RD79 AVB Monitor \u00b7 XMOS AVB listener for the AMS8 / MLC8 (2014|47)", "product": "RD79-AVB Monitor", "year": 2014, "family": "R&D register", "summary": "R&D listener that brings 8 channels of IEEE 802.1 AVB / 1722 audio into the AMS8 and MLC8 monitors through a DSP4YOU XMOS XS1-L16 dongle, a Cyclone IV FPGA clock crossing and a front panel relabelled \u201cAVB\u201d. The model runs the XMOS reference code (gPTP, 1722 listener, media FIFO, clock recovery) from power-up, packet by packet.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: evaluating AVB"], ["second", "One second on the wire"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd79-avb-monitor.png"}, "rd80-amplifier-project": {"id": "rd80-amplifier-project", "name": "RD80 Amplifier Project \u00b7 QubeAmp class-D bench study (2014|47)", "product": "RD80 Amplifier Project", "year": 2014, "family": "R&D register", "summary": "The R&D behind the QubeAmp board: AES or analog in, PCM5100A DAC, NE5532 mixer and a TPA3124D2 class-D stage, measured single-ended and bridged on an Audio Precision analyser in November 2014. The model replays those 11 sweeps on the real ISS.2 assembly drawing, with driver loudness and 24 V supply sizing.", "depth": "Hardware model", "tabs": [["sim", "Simulator (bench)"], ["tutorial", "Tutorial: the sweeps"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path & measurements"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd80-amplifier-project.png"}, "rd84-sabre": {"id": "rd84-sabre", "name": "RD84 Sabre \u00b7 ESS SABRE DAC evaluation (2015|48)", "product": "RD84 Sabre", "year": 2015, "family": "R&D register", "summary": "An evaluation of ESS SABRE DACs and headphone amplifiers against the converters WBS already used. The model compares dynamic range through each kind of output stage, checks the clocking rules against a CS8416-clocked design, and replays an I\u00b2C volume write with the chip\u2019s soft ramp.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the evaluation"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Registers & control"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd84-sabre.png"}, "rd85-archwave-ravenna-monitor": {"id": "rd85-archwave-ravenna-monitor", "name": "RD85 Archwave Ravenna Monitor \u00b7 uNet AES67 on/off ramp for the AMS8-1 (2015|48)", "product": "RD85 Archwave Ravenna Monitor", "year": 2015, "family": "R&D register", "summary": "The 2015\u20132016 evaluation that put an Archwave uNet2500 RAVENNA/AES67 module inside the AMS8-1 monitor. The model runs the archived Verilog bit by bit (I8S \u2192 I2S), locks PTP, streams RTP packets at 1 ms or 125 \u00b5s through a switch with jitter, and shows the receiver-delay budget. It ends in the AMS8-1AN, MLC8N, AMS2-N and 32ME-N.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the evaluation"], ["second", "One second, packet by packet"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd85-archwave-ravenna-monitor.png"}, "rd86-slm1d-with-old-board": {"id": "rd86-slm1d-with-old-board", "name": "RD86 \u00b7 SLM-1D on the old ADSP-21065L board (2016|49)", "product": "RD86 SLM-1D old board", "year": 2016, "family": "R&D register", "summary": "A 2016 R&D attempt to drive the 57-LED SLM1-4 head from the 2002 SLM-1 board (ADSP-21065L + CS8427). The digital v1.01 firmware was merged with the analog SLM-1A display engine. Before/after simulator, MD5 comparison with every SLM master, and the two parts the port missed.", "depth": "Full model", "tabs": [["sim", "Simulator (before / after)"], ["tutorial", "Tutorial: doing the port"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd86-slm1d-with-old-board.png"}, "rd9-dspresearch": {"id": "rd9-dspresearch", "name": "RD9 DSP Research \u00b7 SHARC cycle-budget workbench (2011|44)", "product": "RD9 DSP Research", "year": 2011, "family": "R&D register", "summary": "The Analog Devices DSP library behind every WBS meter. The model turns its numbers (dispatcher overheads, biquad and FIR cycle counts, clock rates, memory) into a live per-sample cycle budget on a redrawn ADSP-21065L EZ-KIT Lite, with the SLM-1, AMS8-2 and M6205 workloads as presets.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: budgeting"], ["second", "One second, sample by sample"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/rd9-dspresearch.png"}, "microdriver": {"id": "microdriver", "name": "microDriver \u00b7 POD6 ISS4 stereo line / headphone driver (2016|49)", "product": "microDriver (POD6)", "year": 2016, "family": "Monitors, meters & tools", "summary": "The surface-mount re-spin (RD76, POD6-ISS4) of Ward-Beck\u2019s 1996|29 POD6 headphone amplifier. Each channel has an NE5532 balanced receiver (\u221214 dB), then an NE5532 driver (+18.3 dB) into a 470 \u00b5F output capacitor, all on a single +24 V supply. The model follows the level, headroom and turn-on through every stage, using the schematic values.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram & board"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/microdriver.png"}, "microimp4": {"id": "microimp4", "name": "microIMP4 \u00b7 4-channel passive interface box (2015|48)", "product": "microIMP4", "year": 2015, "family": "Monitors, meters & tools", "summary": "A Ward-Beck \u201cmicro\u201d box known only from its 2015|48 silkscreen: a printed top cover numbered 1\u20134, four XLR cut-outs on one end, four round holes on the other, and no power. The plugin builds it from the real artwork and models the most likely use: four passive 110 \u03a9 AES3 \u2194 75 \u03a9 coax baluns, down to the biphase-mark bit cells.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram & assembly"], ["schematic", "Schematic (conceptual)"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/microimp4.png"}, "micromatch": {"id": "micromatch", "name": "microMATCH \u00b7 stereo level-matching box (2015|48)", "product": "microMATCH", "year": 2015, "family": "Monitors, meters & tools", "summary": "A small Ward-Beck \u201cmicro\u201d box. The archive keeps only its silkscreen and cover drawings: POWER, a 3.5 mm TRS input, a 12-way terminal block (OUT R, L, MONO as + \u2212 G, IN L G R) and two ADJUST trimmers. The plugin shows the real artwork and holes to scale, and models the consumer-to-pro matching that those labels suggest.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram & assembly"], ["schematic", "Schematic (conceptual)"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/micromatch.png"}, "consoles-r2k": {"id": "consoles-r2k", "name": "R2K \u00b7 broadcast radio console (1999|32)", "product": "R2K consoles", "year": 1999, "family": "Obsolete products", "summary": "The Ward-Beck R2K modular radio console: twenty input modules, output, control-room and studio monitor modules, and a three-processor utility module that runs the timer, polls the studio turrets and masters an RS485 bus. Every input is a PIC that scans its own buttons and fader end-stop. This model runs the real R201 and R206 firmware logic on the real panel silks.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: operating the R2K"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/consoles-r2k.png"}, "55xxxx-systems": {"id": "55xxxx-systems", "name": "Custom 55xxxx systems \u00b7 customer jobs, R2K hub/turret system (2008|41)", "product": "Custom 55xxxx systems", "year": 2008, "family": "Obsolete products", "summary": "About 100 Ward-Beck custom jobs from 1999|32 to 2011|44, each with a summary card and a job selector. The most complete, 557572 for Rogers Kitchener, runs in full: an ATmega128 hub polling two R2K consoles and a custom PIC turret, with its volume controller and Mode 7 cough logic.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: the 557572 system"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["jobs", "Jobs"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/55xxxx-systems.png"}, "systems-94-98": {"id": "systems-94-98", "name": "Custom systems 1994\u201398 \u00b7 37 custom jobs + CTV RS422 relay link (1994|27)", "product": "Custom systems 1994\u201398", "year": 1994, "family": "Obsolete products", "summary": "Ward-Beck's custom-job drawings from 1994|27\u20131999|32 (Renaissance consoles for WBZ, CFNY, CBC and others, intercom matrices, turrets, a TTC PA relay card), each with a summary card. The job with code, the CTV RS422 link, is emulated pass by pass: a PIC16F874 synchronous transmitter whose bursts an asynchronous PIC receiver decodes into six relay closures.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the link"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/systems-94-98.png"}, "serialbox": {"id": "serialbox", "name": "Serialboxx \u00b7 MF100 frame and SD403 SDI audio demuxer (2001|34)", "product": "Serialboxx series", "year": 2001, "family": "Obsolete products", "summary": "The Serialboxx card frame (MF100, two M8245A supplies, BNC and TB terminations) with the SD403A/B/C SDI audio demultiplexer run pass by pass from its ATmega128 firmware: CD debounce, group select, pair swap, remote swap and the self-healing FPGA link. Every other Serialboxx card is on a slot selector.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: SD403 in an MF100"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/serialbox.png"}, "fc6221": {"id": "fc6221", "name": "FC6221 \u00b7 MF6220 frame controller card (2007|40)", "product": "FC6221", "year": 2007, "family": "Obsolete products", "summary": "The \u201c#PROBLEM\u201d board decoded: an AT90CAN128 card for slot 21 of Ward-Beck's MF6220 openGear frame \u2014 CAN to the cards, 1-Wire to the frame EEPROM and power supplies, I\u00b2C and switched power to the fan board, FAULT/ALARM and a buzzer. No firmware exists, so the model follows every net of the 2007 netlist.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Pin capabilities (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/fc6221.png"}, "impxx": {"id": "impxx", "name": "IMPxx \u00b7 IMP impedance-matching transformers and panels (1997|30)", "product": "IMPXX", "year": 1997, "family": "Obsolete products", "summary": "Passive AES3 impedance-matching transformers: one transformer per channel converts 110 \u03a9 balanced (XLR or Phoenix) to 75 \u03a9 unbalanced BNC (AES3id). Made as the IMP-1M/1F in-line tube and as 12- and 20-channel rack panels, redrawn in 2013.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: patching an IMP"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/impxx.png"}, "obsolete-misc": {"id": "obsolete-misc", "name": "Obsolete misc \u00b7 small PCBs from H:\\misc (2005|38)", "product": "Obsolete misc", "year": 2005, "family": "Obsolete products", "summary": "A tour of the folder\u2019s small 2005 boards, drawn from their Gerbers. The largest, WBS_IO2, turns out to be the 554951-3 communication interface that links two R2K consoles and a custom R257 turret; its real firmware drives the simulation. Also an RS-232/RS-422 converter, a CS8412 DIP-to-SOIC carrier, the WBS I/O-1 board and the R257 turret boards.", "depth": "Hardware model", "tabs": [["sim", "Simulator (folder tour)"], ["tutorial", "Tutorial"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software (554951-3)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/obsolete-misc.png"}, "sd405-iss1": {"id": "sd405-iss1", "name": "Sd405 - ISS1 \u00b7 SD405 SDI audio muxer card, issue 1 schematic (2003|36)",
