<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
:root { --desk:#2b2a27; --paper:#fbfaf4; --ink:#1f1e1c; --faint:#6d6a63; --rule:#cfcabc; --link:#1f3f6b;
  --panel:#3b3e42; --panel2:#2c2f33; --legend:#f2efe6; --lamp-on:#ff4b3a; --lamp-g:#5dff7a; --meter:#f4ecd2; }
* { box-sizing:border-box }
html { background:var(--desk) }
body { margin:0; padding:20px 16px 50px; color:var(--ink); font:14px/1.5 "Courier Prime","Courier New",monospace }
.sheet { max-width:1180px; margin:0 auto; background:var(--paper); padding:24px clamp(16px,4vw,40px) 36px;
  box-shadow:0 18px 40px rgba(0,0,0,.5) }
.top { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; margin-bottom:6px }
.top a { color:var(--link) }
h1 { font-size:20px; margin:0; text-transform:uppercase; text-decoration:underline; text-underline-offset:5px }
.note { color:var(--faint); margin:4px 0 14px; max-width:80ch }
.pick { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 16px }
.pick input { font:inherit; border:0; border-bottom:1.5px solid var(--ink); background:transparent; width:16ch; padding:0 4px }
button.b { font:inherit; background:#ece6d2; border:1px solid var(--rule); padding:3px 10px; cursor:pointer }
button.b.on { background:#1f3f6b; color:#fff }
.lay { display:grid; grid-template-columns:auto minmax(0,1fr); gap:22px; align-items:start }
@media (max-width:820px) { .lay { grid-template-columns:1fr } }
.front { display:flex; gap:14px; align-items:flex-start }
.photo img { max-width:170px; max-height:620px; border:1px solid var(--rule); background:#fff; display:block }
.photo .cap { font-size:11px; color:var(--faint); max-width:170px }
svg.panel { touch-action:none; user-select:none; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)) }
.right h2 { font-size:15px; margin:14px 0 6px; text-transform:uppercase; text-decoration:underline }
.gen { display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; max-width:520px }
.gen input[type=range] { width:100% }
.read { display:flex; flex-wrap:wrap; gap:8px 18px; margin:8px 0 }
.read div { min-width:140px } .read b { font-size:18px; display:block }
canvas { width:100%; height:150px; background:#10140f; border:1px solid #000; display:block }
.small { font-size:12px; color:var(--faint) }
select { font:inherit }
</style>
</head>
<body>
<article class="sheet">
  <div class="top"><a href="index.html">Index</a><a href="Home.html">Wiki home</a><a id="pagelink" href="#">Module page</a><a id="pkglink" href="#">Download package</a></div>
  <h1 id="title">Module simulator</h1>
  <p class="note" id="note"></p>
  <div class="pick"><label for="q">Module:</label><input id="q" list="mods" placeholder="M441M" autocomplete="off">
    <datalist id="mods"></datalist><button class="b" id="go">Load</button>
    <button class="b" id="power">▶ Start audio</button><button class="b" id="listen" title="Send the output to your speakers">🔈 Listen: off</button></div>
  <div class="lay">
    <div class="front"><svg class="panel" id="panel"></svg><div class="photo" id="photo"></div></div>
    <div class="right">
      <h2>Test signal (generator)</h2>
      <div class="gen" id="gen">
        <span>Wave</span><select id="wave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">saw</option><option value="noise">pink noise</option><option value="sweep">sweep 20 Hz–20 kHz</option></select><span></span>
        <span>Freq</span><input type="range" id="freq" min="0" max="1" step="0.001" value="0.567"><span id="freqv">1000 Hz</span>
        <span>Level</span><input type="range" id="lvl" min="-60" max="24" step="0.5" value="4"><span id="lvlv">+4.0 dBu</span>
      </div>
      <h2>Output</h2>
      <div class="read" id="read"></div>
      <canvas id="scope" width="900" height="150" aria-label="oscilloscope"></canvas>
      <p class="small">Oscilloscope (output 1)</p>
      <canvas id="spec" width="900" height="150" aria-label="spectrum"></canvas>
      <p class="small">Spectrum, 20 Hz – 20 kHz (output 1). Levels: 0 dBFS sine = +24 dBu; +4 dBu = 1.228 V rms.</p>
    </div>
  </div>
</article>

function tplFor(m) {
  const n = (m.name || '').toLowerCase(), c = m.category;
  if (/oscillat/.test(n)) return 'osc';
  if (/meter|vu\b|ppm/.test(n) || c === 'METER' || c === 'METERING') return 'meter';
  if (/compress|limit|gate|dynamic/.test(n) || c === 'DYNAMICS') return 'comp';
  if (/equali|filter|\beq\b/.test(n) || c === 'FILTERS') return 'eq';
  if (/distribution|\bda\b/.test(n)) return 'da';
  if (/power supply|psu/.test(n) || c === 'POWER') return 'psu';
  if (/monitor/.test(n) || c === 'MONITORING') return 'monitor';
  if (/talkback|intercom|crosspoint/.test(n) || c === 'COMMUNICATION') return 'intercom';
  if (/switch|selector|interface|router/.test(n) || c === 'ROUTING') return 'select';
  if (/summ|master|submaster|mix/.test(n) || c === 'SUMMING') return 'sum';
  if (/input|pre-?amp|mic/.test(n) || c === 'INPUT-PRE-AMPS') return 'input';
  if (c === 'LOGIC' || c === 'COMPUTERS' || /relay|latch|logic/.test(n)) return 'logic';
  if (c === 'AMPLIFIERS' || c === 'OPENGEAR' || c === '8200 SERIES') return /amplifier/.test(n) && !/distribution/.test(n) ? 'amp' : 'da';
  return 'amp';
}

// ---------------------------------------------------------------- audio engine
let ctx = null, mod = null, tpl = null, P = {}, graph = null, listen = false;
const dbToLin = d => Math.pow(10, d / 20);
const toDbu = rms => rms > 1e-9 ? 20 * Math.log10(rms * Math.SQRT2) + 24 : -Infinity;   // 0 dBFS sine = +24 dBu
function freqFromSlider(v) { return 20 * Math.pow(1000, v); }
function makeNoise() {
  const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < d.length; i++) {   // Paul Kellet's pink-noise filter
    const w = Math.random() * 2 - 1;
    b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852; b3 = .8665 * b3 + w * .3104856;
    b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898; d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .11; b6 = w * .115926;
  }
  const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; return s;
}
function sourceNode(freq, wave) {
  if (wave === 'noise') { const s = makeNoise(); s.start(); return s; }
  const o = ctx.createOscillator(); o.type = wave === 'sweep' ? 'sine' : wave; o.frequency.value = freq;
  if (wave === 'sweep') { const t = ctx.currentTime; o.frequency.setValueAtTime(20, t); o.frequency.exponentialRampToValueAtTime(20000, t + 10);
    o.frequency.setValueAtTime(20, t + 10.01); setTimeout(() => { if (graph) rebuild(); }, 10100); }
  o.start(); return o;
}
function biquad(type, f, g, q) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (g !== undefined) b.gain.value = g; if (q) b.Q.value = q; return b; }
function chain(nodes) { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); return nodes[nodes.length - 1]; }

function rebuild() {
  if (!ctx) return;
  if (graph) { graph.stop.forEach(n => { try { n.stop(); } catch (e) {} }); graph.all.forEach(n => { try { n.disconnect(); } catch (e) {} }); }
  const all = [], stop = [], outs = [];
  const T = (n) => { all.push(n); return n; };
  const wave = $('wave').value, f = freqFromSlider(+$('freq').value), lvl = dbToLin(+$('lvl').value - 24);
  const gen = () => { const s = T(sourceNode(f, wave)); stop.push(s); const g = T(ctx.createGain()); g.gain.value = lvl; s.connect(g); return g; };
  const G = d => { const g = T(ctx.createGain()); g.gain.value = dbToLin(d); return g; };
  const key = tplFor(mod);
  let comp = null;
  if (key === 'input') {
    const inG = G(P.gain + (P.mic ? 0 : -40) + (P.pad ? -20 : 0) - 30);   // mic gain referred to a -30 dBu-ish source
    const hp = T(biquad(P.hpf ? 'highpass' : 'allpass', 80));
    const lf = T(biquad('lowshelf', 100, P.lf)), mf = T(biquad('peaking', P.mff, P.mf, 1)), hf = T(biquad('highshelf', 10000, P.hf));
    outs.push(chain([gen(), inG, hp, lf, mf, hf, G(P.on ? (P.fader <= -60 ? -200 : P.fader) : -200)]));
  } else if (key === 'eq') {
    const nodes = P.in ? [T(biquad(P.hpf ? 'highpass' : 'allpass', 80)), T(biquad(P.lpf ? 'lowpass' : 'allpass', 10000)),
      T(biquad('lowshelf', 100, P.lf)), T(biquad('peaking', P.mff, P.mf, 1)), T(biquad('highshelf', 10000, P.hf))] : [G(0)];
    outs.push(chain([gen(), ...nodes]));
  } else if (key === 'comp') {
    comp = T(ctx.createDynamicsCompressor());
    comp.threshold.value = P.in ? P.thr : 0; comp.ratio.value = P.in ? P.ratio : 1; comp.knee.value = 6;
    comp.attack.value = P.att / 1000; comp.release.value = P.rel / 1000;
    outs.push(chain([gen(), comp, G(P.in ? P.mk : 0)]));
  } else if (key === 'sum') {
    const mix = G(P.on ? (P.fader <= -60 ? -200 : P.fader) : -200);
    [100, 440, 1000, 5000].forEach((fr, i) => { const s = T(sourceNode(fr, 'sine')); stop.push(s); const g = G(P['c' + (i + 1)] + (+$('lvl').value - 24)); s.connect(g); g.connect(mix); });
    outs.push(mix);
  } else if (key === 'select') {
    const s = T(sourceNode(100 * P.sel, 'sine')); stop.push(s);
    const g = G(+$('lvl').value - 24); s.connect(g); outs.push(chain([g, G(P.on ? P.gain : -200)]));
  } else if (key === 'monitor') {
    const s = T(sourceNode(P.sel === 1 ? f : f * 1.5, wave === 'noise' || wave === 'sweep' ? 'sine' : wave)); stop.push(s);
    const g = G(+$('lvl').value - 24); s.connect(g);
    outs.push(chain([g, G(P.cut ? -200 : P.vol + (P.dim ? -20 : 0))]));
  } else if (key === 'meter') {
    outs.push(chain([gen(), G(P.trim)]));
  } else if (key === 'da') {
    const inp = chain([gen(), G(P.gain)]);
    for (let i = 1; i <= 4; i++) { const o = G(P['o' + i]); inp.connect(o); outs.push(o); }
  } else if (key === 'amp') {
    outs.push(chain([gen(), G(P.on ? P.gain : -200)]));
  } else if (key === 'osc') {
    const fr = [100, 1000, 10000, 400][P.fsel - 1];
    const s = T(sourceNode(fr, P.sq ? 'square' : 'sine')); stop.push(s);
    outs.push(chain([s, G(P.on ? P.lvl - 24 : -200)]));
  } else if (key === 'logic') {
    outs.push(chain([gen(), G(P.k1 ? 0 : -200)]));
  } else if (key === 'intercom') {
    outs.push(chain([gen(), G(P.talk && P.x1 ? P.tb : -200), G(P.vol)]));
  }
  const analysers = outs.map(o => { const a = T(ctx.createAnalyser()); a.fftSize = 4096; a.smoothingTimeConstant = .6; o.connect(a); return a; });
  const mon = T(ctx.createGain()); mon.gain.value = listen ? .5 : 0;
  if (outs[0]) { outs[0].connect(mon); mon.connect(ctx.destination); }
  graph = { all, stop, outs, analysers, comp, key };
}

function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const meters = {};
function fmt(v, unit) { return unit === 'Hz' ? (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : Math.round(v)) : unit === 'ms' ? Math.round(v) : (Math.round(v * 10) / 10) + (unit === 'dB' ? '' : ''); }
function drawPanel() {
  const svg = $('panel'); svg.innerHTML = '';
  const W = 120, rowH = { knob: 84, sw: 50, btn: 52, fader: 190, rot: 92, meter: 96 };
  let H = 90 + tpl.controls.reduce((s, c) => s + rowH[c[0]], 0) + 30;

  el('rect', { x: 0, y: 0, width: W, height: H, rx: 3, fill: 'var(--panel)' }, svg);
  el('rect', { x: 4, y: 4, width: W - 8, height: H - 8, rx: 2, fill: 'none', stroke: '#55595e' }, svg);
  [10, H - 10].forEach(y => el('circle', { cx: W / 2, cy: y, r: 3, fill: '#888', stroke: '#222' }, svg));   // mounting screws
  const lab = (t, x, y, size = 7, fill = 'var(--legend)') => { const e = el('text', { x, y, 'text-anchor': 'middle', 'font-size': size, fill, 'font-family': 'Arial, sans-serif', 'font-weight': 700 }, svg); e.textContent = t; return e; };
  el('rect', { x: 14, y: 20, width: W - 28, height: 18, rx: 6, fill: 'none', stroke: 'var(--legend)', 'stroke-width': 1.4 }, svg);
  lab('WBS', W / 2, 33, 11);
  lab(mod.code, W / 2, 56, 10);
  const nm = (mod.name || '').toUpperCase().slice(0, 22); lab(nm, W / 2, 68, 5.2, '#cfcabb');
  let y = 86;
  tpl.controls.forEach(c => {
    const [type, id, label] = c, cx = W / 2;
    if (type === 'knob' || type === 'rot') {
      const [min, max] = [c[4], c[5]], r = 17, cy = y + 38;
      lab(label, cx, y + 8, 6.4);
      for (let i = 0; i <= 10; i++) { const a = (-135 + i * 27) * Math.PI / 180; el('line', { x1: cx + Math.sin(a) * (r + 3), y1: cy - Math.cos(a) * (r + 3), x2: cx + Math.sin(a) * (r + 7), y2: cy - Math.cos(a) * (r + 7), stroke: 'var(--legend)', 'stroke-width': .8 }, svg); }
      const g = el('g', { style: 'cursor:ns-resize', tabindex: 0, role: 'slider', 'aria-label': label }, svg);
      el('circle', { cx, cy, r, fill: '#151515', stroke: '#000' }, g);
      el('circle', { cx, cy, r: r - 5, fill: '#262626' }, g);
      const ptr = el('line', { x1: cx, y1: cy, x2: cx, y2: cy - r + 2, stroke: '#fff', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, g);
      const val = lab('', cx, cy + r + 15, 6.2, '#f3d27a');
      const unit = c[6] || '';
      const set = v => { v = Math.max(min, Math.min(max, type === 'rot' ? Math.round(v) : v)); P[id] = v;
        const t = (v - min) / (max - min); ptr.setAttribute('transform', `rotate(${-135 + 270 * t} ${cx} ${cy})`);
        val.textContent = type === 'rot' ? (id === 'fsel' ? ['100', '1k', '10k', '400'][v - 1] : v) : fmt(v, unit) + (unit && unit !== 'Hz' ? ' ' + unit : unit === 'Hz' ? ' Hz' : ''); rebuild(); };
      const log = unit === 'Hz';
      const step = (v, dir) => log ? v * Math.pow(max / min, dir * .02) : v + dir * (type === 'rot' ? 1 : (max - min) / 100);
      let drag = null;
      g.addEventListener('pointerdown', e => { drag = { y: e.clientY, v: P[id] }; g.setPointerCapture(e.pointerId); });
      g.addEventListener('pointermove', e => { if (!drag) return; const d = (drag.y - e.clientY) / (type === 'rot' ? 18 : 2); let v = drag.v;
        if (type === 'rot') v = drag.v + Math.round(d); else if (log) v = drag.v * Math.pow(max / min, d / 100); else v = drag.v + d * (max - min) / 100; set(v); });
      g.addEventListener('pointerup', () => drag = null);
      g.addEventListener('wheel', e => { e.preventDefault(); set(step(P[id], e.deltaY < 0 ? 1 : -1)); }, { passive: false });
      g.addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowRight') set(step(P[id], 1)); if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') set(step(P[id], -1)); });
      P[id] = c[3]; ptr.setAttribute('transform', `rotate(${-135 + 270 * (c[3] - min) / (max - min)} ${cx} ${cy})`);
      val.textContent = type === 'rot' ? (id === 'fsel' ? ['100', '1k', '10k', '400'][c[3] - 1] : c[3]) : fmt(c[3], unit) + (unit === 'Hz' ? ' Hz' : unit ? ' ' + unit : '');
    } else if (type === 'sw') {
      lab(label, cx, y + 8, 6.4);
      const g = el('g', { style: 'cursor:pointer', tabindex: 0, role: 'switch', 'aria-label': label }, svg);
      el('rect', { x: cx - 9, y: y + 14, width: 18, height: 26, rx: 3, fill: '#999', stroke: '#222' }, g);
      const bat = el('rect', { x: cx - 3, y: y + 14, width: 6, height: 14, rx: 2, fill: '#eee', stroke: '#444' }, g);
      const set = v => { P[id] = v; bat.setAttribute('y', v ? y + 13 : y + 27); rebuild(); };
      g.addEventListener('click', () => set(P[id] ? 0 : 1)); g.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); set(P[id] ? 0 : 1); } });
      P[id] = c[3]; bat.setAttribute('y', c[3] ? y + 13 : y + 27);
    } else if (type === 'btn') {
      const g = el('g', { style: 'cursor:pointer', tabindex: 0, role: 'button', 'aria-label': label }, svg);
      const cap = el('rect', { x: cx - 22, y: y + 8, width: 44, height: 24, rx: 3, stroke: '#111' }, g);
      const t = el('text', { x: cx, y: y + 24, 'text-anchor': 'middle', 'font-size': 7, 'font-family': 'Arial, sans-serif', 'font-weight': 700 }, g); t.textContent = label;
      const set = v => { P[id] = v; cap.setAttribute('fill', v ? (id === 'talk' || id === 'cut' ? 'var(--lamp-on)' : 'var(--lamp-g)') : '#5a5a55');
        cap.setAttribute('style', v ? 'filter:drop-shadow(0 0 4px rgba(255,120,80,.8))' : ''); t.setAttribute('fill', v ? '#111' : '#ddd'); rebuild(); };
      g.addEventListener('click', () => set(P[id] ? 0 : 1)); g.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); set(P[id] ? 0 : 1); } });
      P[id] = c[3]; cap.setAttribute('fill', c[3] ? 'var(--lamp-g)' : '#5a5a55'); t.setAttribute('fill', c[3] ? '#111' : '#ddd');
    } else if (type === 'fader') {
      const [min, max] = [c[4], c[5]], top = y + 18, len = 150;
      lab(label, cx, y + 8, 6.4);
      el('rect', { x: cx - 2, y: top, width: 4, height: len, fill: '#111' }, svg);
      [10, 0, -10, -20, -30, -40, -60].forEach(d => { const yy = top + (max - d) / (max - min) * len; el('line', { x1: cx + 8, y1: yy, x2: cx + 14, y2: yy, stroke: 'var(--legend)', 'stroke-width': .7 }, svg); lab(d === -60 ? '∞' : String(d), cx + 24, yy + 2, 5); });
      const g = el('g', { style: 'cursor:ns-resize', tabindex: 0, role: 'slider', 'aria-label': label }, svg);
      const knob = el('rect', { x: cx - 13, y: 0, width: 26, height: 14, rx: 2, fill: '#ddd', stroke: '#222' }, g);
      el('line', { x1: cx - 13, y1: 7, x2: cx + 13, y2: 7, stroke: '#222' }, g);
      const set = v => { v = Math.max(min, Math.min(max, v)); P[id] = v; g.setAttribute('transform', `translate(0 ${top - 7 + (max - v) / (max - min) * len})`); rebuild(); };
      let drag = null;
      g.addEventListener('pointerdown', e => { drag = { y: e.clientY, v: P[id] }; g.setPointerCapture(e.pointerId); });
      g.addEventListener('pointermove', e => { if (drag) set(drag.v - (e.clientY - drag.y) / 1.6 / len * (max - min)); });
      g.addEventListener('pointerup', () => drag = null);
      g.addEventListener('wheel', e => { e.preventDefault(); set(P[id] + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
      g.addEventListener('keydown', e => { if (e.key === 'ArrowUp') set(P[id] + 1); if (e.key === 'ArrowDown') set(P[id] - 1); });
      P[id] = c[3]; g.setAttribute('transform', `translate(0 ${top - 7 + (max - c[3]) / (max - min) * len})`);
    } else if (type === 'meter') {
      lab(label, cx, y + 8, 6.4);
      el('rect', { x: 12, y: y + 13, width: W - 24, height: 72, rx: 3, fill: 'var(--meter)', stroke: '#111' }, svg);
      const mcx = W / 2, mcy = y + 80, R = 54;
      [-20, -10, -7, -5, -3, 0, 3].forEach(d => { const a = (d + 20) / 23 * 90 - 45, rad = a * Math.PI / 180;
        el('line', { x1: mcx + Math.sin(rad) * (R - 6), y1: mcy - Math.cos(rad) * (R - 6), x2: mcx + Math.sin(rad) * R, y2: mcy - Math.cos(rad) * R, stroke: d > 0 ? '#b31d12' : '#222', 'stroke-width': 1 }, svg);
        const t = el('text', { x: mcx + Math.sin(rad) * (R - 13), y: mcy - Math.cos(rad) * (R - 13) + 2, 'text-anchor': 'middle', 'font-size': 5, fill: d > 0 ? '#b31d12' : '#222', 'font-family': 'Arial' }, svg); t.textContent = d; });
      const t2 = el('text', { x: mcx, y: y + 68, 'text-anchor': 'middle', 'font-size': 6, fill: '#222', 'font-family': 'Arial', 'font-weight': 700 }, svg); t2.textContent = id === 'gr' ? 'GR dB' : 'VU';
      const needle = el('line', { x1: mcx, y1: mcy, x2: mcx, y2: mcy - R + 2, stroke: '#111', 'stroke-width': 1.1 }, svg);
      meters[id] = { needle, mcx, mcy, v: -20 };
    }
    y += rowH[type];
  });
}

// ---------------------------------------------------------------- readouts, scope, spectrum
const buf = new Float32Array(4096), fbuf = new Float32Array(2048);
function loop() {
  requestAnimationFrame(loop);
  if (!graph) return;
  const rd = $('read');
  if (graph.key === 'psu') {
    const load = P.load / 100, on = P.on;
    rd.innerHTML = [['+24 V rail', on ? (24 - .3 * load).toFixed(2) + ' V' : '0 V'], ['−24 V rail', on ? (-24 + .3 * load).toFixed(2) + ' V' : '0 V'],
      ['48 V phantom', on ? (48 - .5 * load).toFixed(2) + ' V' : '0 V'], ['Ripple', on ? (2 + 18 * load).toFixed(1) + ' mV p-p' : '—']]
      .map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('');
    return;
  }
  const levels = graph.analysers.map(a => { a.getFloatTimeDomainData(buf); let s = 0, pk = 0; for (let i = 0; i < buf.length; i++) { s += buf[i] * buf[i]; pk = Math.max(pk, Math.abs(buf[i])); } return [Math.sqrt(s / buf.length), pk]; });
  rd.innerHTML = levels.map(([r, pk], i) => { const d = toDbu(r); const v = r * Math.SQRT2 * 12.28;   // +24 dBu ≈ 12.28 V rms at 0 dBFS sine
    const extra = graph.key === 'amp' && /watt|power|monitor amp/i.test(mod.name || '') ? ` · ${(v * v / 8).toFixed(1)} W into 8 Ω` : '';
    return `<div>Output ${levels.length > 1 ? i + 1 : ''}<b>${isFinite(d) ? (d >= 0 ? '+' : '') + d.toFixed(1) + ' dBu' : '— dBu'}</b>${isFinite(d) ? v.toFixed(3) + ' V rms' + extra : 'silent'}</div>`; }).join('')
    + (graph.comp ? `<div>Gain reduction<b>${graph.comp.reduction.toFixed(1)} dB</b></div>` : '');
  for (const id in meters) {   // meter ballistics: VU ≈ 300 ms, PPM fast attack / slow fall
    const m = meters[id]; let target;
    if (id === 'gr') target = -20 + Math.min(23, -(graph.comp ? graph.comp.reduction : 0)); else target = Math.max(-20, Math.min(3, toDbu(levels[0][0]) - 4));
    const ppm = P.ppm; const k = id === 'gr' ? .2 : ppm ? (target > m.v ? .6 : .02) : .08;
    m.v += (target - m.v) * k; const a = (m.v + 20) / 23 * 90 - 45; m.needle.setAttribute('transform', `rotate(${a} ${m.mcx} ${m.mcy})`);
  }
  const a = graph.analysers[0]; if (!a) return;
  const sc = $('scope'), g = sc.getContext('2d'); a.getFloatTimeDomainData(buf);
  g.fillStyle = '#10140f'; g.fillRect(0, 0, sc.width, sc.height); g.strokeStyle = '#25331f'; g.beginPath(); g.moveTo(0, sc.height / 2); g.lineTo(sc.width, sc.height / 2); g.stroke();
  g.strokeStyle = '#7dff8a'; g.beginPath(); let st = 0; for (let i = 1; i < 1500; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { st = i; break; }
  for (let x = 0; x < sc.width; x++) { const v = buf[st + Math.floor(x * 1.6)] || 0; const yy = sc.height / 2 - v * sc.height * .45; x ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke();
  const sp = $('spec'), h = sp.getContext('2d'); a.getFloatFrequencyData(fbuf);
  h.fillStyle = '#10140f'; h.fillRect(0, 0, sp.width, sp.height); h.fillStyle = '#6fb0e0';
  const ny = ctx.sampleRate / 2;
  for (let x = 0; x < sp.width; x++) { const fr = 20 * Math.pow(1000, x / sp.width), bin = Math.min(fbuf.length - 1, Math.round(fr / ny * fbuf.length));
    const db = fbuf[bin], hh = Math.max(0, (db + 120) / 120 * sp.height); h.fillRect(x, sp.height - hh, 1, hh); }
}

// ---------------------------------------------------------------- loading a module
function load(code) {
  mod = byCode[code] || byCode[(code || '').toUpperCase()] || MODS.find(m => m.code.toLowerCase() === (code || '').toLowerCase());
  if (!mod) mod = byCode.M441M || MODS[0];
  tpl = TPL[tplFor(mod)]; for (const k in meters) delete meters[k]; P = {};
  document.title = mod.code + ' · Simulator';
  $('title').textContent = mod.code + (mod.name ? ' — ' + mod.name : '') + ' · simulator';
  $('q').value = mod.code;
  $('note').innerHTML = `${tpl.what} <b>Behavioural mock-up</b> from the module type, not a circuit-accurate simulation.` +
    (mod.spice ? ` A SPICE / KiCad model exists for this module: <a href="${mod.spice}">design files</a>.` : '') +
    (mod.year ? ` Earliest dated evidence: ${mod.year}.` : '');
  $('pagelink').href = mod.page || '#'; $('pkglink').href = mod.pkg || '#'; $('pkglink').style.display = mod.pkg ? '' : 'none';
  $('gen').style.opacity = tpl.self || tpl.noaudio ? .4 : 1;
  $('photo').innerHTML = mod.photo ? `<img src="${encodeURI(mod.photo)}" alt="${mod.code} photo"><div class="cap">${mod.code} — photograph from the archive</div>` : '';
  drawPanel(); rebuild();
  history.replaceState(null, '', '?m=' + encodeURIComponent(mod.code));
}
$('go').onclick = () => load($('q').value.trim());
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') load($('q').value.trim()); });
['wave', 'freq', 'lvl'].forEach(id => $(id).addEventListener('input', () => {
  $('freqv').textContent = Math.round(freqFromSlider(+$('freq').value)) + ' Hz';
  const l = +$('lvl').value; $('lvlv').textContent = (l >= 0 ? '+' : '') + l.toFixed(1) + ' dBu'; rebuild(); }));
$('power').onclick = async () => {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); requestAnimationFrame(loop); }
  if (ctx.state === 'suspended') ctx.resume();   // don't wait: some systems (no audio device) never settle
  $('power').textContent = '■ Audio running'; $('power').classList.add('on'); rebuild();
};
$('listen').onclick = () => { listen = !listen; $('listen').textContent = listen ? '🔊 Listen: on' : '🔈 Listen: off'; $('listen').classList.toggle('on', listen); rebuild(); };
const QS = new URLSearchParams(location.search);   // read before load() rewrites the address
load(QS.get('m') || 'M441M');
if (QS.get('autostart')) $('power').click();   // for testing; browsers normally need a click
</script>
