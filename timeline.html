<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  --desk:#2b2a27; --paper:#fbfaf4; --ink:#1f1e1c; --faint:#6d6a63; --rule:#d6d0c0; --link:#1f3f6b; --hl:#f3ecd2;
  --job:#a8442a; --project:#7a5a2e; --event:#1f3f6b;
  --c-in:#2f6f8f; --c-flt:#3f7f4f; --c-dyn:#8f4f2f; --c-sum:#5f4f8f; --c-rte:#2f7f7f; --c-mon:#7f6f2f; --c-met:#8f2f4f;
  --c-amp:#4f6f2f; --c-pow:#6f4f4f; --c-log:#4f5f6f; --c-com:#2f5f9f; --c-con:#6f3f7f; --c-prod:#3f6f8f; --c-oth:#6d6a63;
}
* { box-sizing:border-box }
html { background:var(--desk) }
body { margin:0; padding:24px 16px 60px; color:var(--ink); font:15px/1.5 "Courier Prime","Courier New",Courier,monospace }
.sheet { max-width:1100px; margin:0 auto; background:var(--paper); padding:clamp(20px,4vw,48px) clamp(16px,5vw,56px) 48px;
  box-shadow:0 1px 0 #d8d4c6, 0 18px 40px rgba(0,0,0,.5) }
.top { display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--faint); margin-bottom:14px }
a { color:var(--link); text-underline-offset:3px; text-decoration-thickness:1px } a:hover { background:var(--hl) }
h1 { font-size:22px; margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em; text-decoration:underline; text-underline-offset:6px }
.lede { color:var(--faint); max-width:78ch; margin:8px 0 16px }
.bar { position:sticky; top:0; z-index:5; background:var(--paper); padding:10px 0 8px; border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center }
.bar input[type=search] { font:inherit; border:0; border-bottom:1.5px solid var(--ink); background:transparent; width:22ch; padding:0 4px }
.bar label { white-space:nowrap; cursor:pointer } .bar label input { accent-color:var(--ink) }
.decades { display:flex; flex-wrap:wrap; gap:4px 10px; width:100% } .decades a { font-weight:700 }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--faint); font-size:13px; margin:12px 0 0 }
.legend span { display:inline-flex; align-items:center; gap:5px }
.sw { width:12px; height:12px; border-radius:2px; display:inline-block }
.sw.est { background:transparent !important; border:1.5px dashed var(--ink) }
.decade h2 { font-size:18px; margin:30px 0 4px; text-transform:uppercase; text-decoration:underline; text-underline-offset:5px; scroll-margin-top:110px }
/* a spine down the middle: projects on the left, the year and its events in the centre, devices on the right */
.year { display:grid; grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr); grid-template-areas:"pj y dv" "pj ev dv";
  grid-template-rows:auto 1fr; gap:4px 18px; padding:10px 0; border-bottom:1px dotted var(--rule); scroll-margin-top:110px }
.year > .y { grid-area:y; font-weight:700; font-size:18px; text-align:center }
.year > .pj { grid-area:pj; text-align:right } .year > .pj .proj .sub { text-align:right }
.year > .dv { grid-area:dv } .year > .ev { grid-area:ev; text-align:center; font-size:13px }
.year > .ev h3 { display:none } .year > .ev .ev::before { content:"" } .year > .ev .empty { display:none }
#tl:not(:empty) { background:linear-gradient(var(--rule), var(--rule)) center top / 1px 100% no-repeat }
#tl { position:relative }
#wires { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:1 }
#wires path { fill:none; stroke-width:1.2; opacity:.22; transition:opacity .15s }
#wires path.lifeline { stroke:var(--project); stroke-width:2.2; stroke-dasharray:6 4; opacity:.75 }
#wires.focus path { opacity:.04 } #wires.focus path.on { opacity:.95; stroke-width:2 }
.proj.life b::before { content:"⟲ "; color:var(--faint) }
.proj.lit, .chip.lit { outline:2px solid var(--ink); outline-offset:1px }
.col h3 { margin:0 0 4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400 }
.proj { margin:0 0 5px; cursor:pointer } .proj b { color:var(--job) } .proj.p b { color:var(--project) }
.proj .sub { display:block; font-size:12.5px; color:var(--faint) }
.chips { display:flex; flex-wrap:wrap; gap:4px }
.chip { font:inherit; font-size:12.5px; border:0; border-radius:3px; padding:1px 6px; color:#fff; cursor:pointer; line-height:1.5 }
.chip.medium { opacity:.82 } .chip.est { background:transparent !important; outline:1.5px dashed currentColor; outline-offset:-1.5px }
.chip .n { opacity:.85; font-size:11px }
.ev { margin:0 0 4px; cursor:pointer } .ev::before { content:"▸ "; color:var(--event) }
.empty { color:#b9b3a3 }
.hide { display:none !important }
details.undated { margin-top:28px } details.undated summary { cursor:pointer; font-weight:700 }
#card { position:fixed; right:16px; bottom:16px; width:min(380px, calc(100vw - 32px)); max-height:70vh; overflow:auto; background:var(--paper);
  border:1px solid var(--ink); box-shadow:0 10px 30px rgba(0,0,0,.35); padding:14px 16px; display:none; z-index:10 }
#card h4 { margin:0 24px 4px 0; font-size:16px } #card .x { position:absolute; right:10px; top:6px; border:0; background:none; font:inherit; font-size:18px; cursor:pointer }
#card dl { display:grid; grid-template-columns:max-content 1fr; gap:2px 10px; margin:8px 0 } #card dt { color:var(--faint) } #card dd { margin:0; word-break:break-word }
@media (max-width:760px) { .year { grid-template-columns:1fr; grid-template-areas:"y" "pj" "dv" "ev"; grid-template-rows:none; gap:6px }
  .year > .y { font-size:20px; text-align:left } .year > .pj, .year > .pj .proj .sub, .year > .ev { text-align:left } #tl { background:none } }
.foot { margin-top:36px; text-align:center; color:var(--faint); font-size:13px }
/* across: the timeline unfolds left to right, one column a year, its projects, devices and events in bands */
body.across .sheet { max-width:none }
body.across #tl { display:grid; grid-auto-flow:column; grid-template-rows:repeat(5, auto); grid-auto-columns:minmax(150px, 230px);
  overflow-x:auto; overscroll-behavior-x:contain; padding-bottom:14px; scroll-snap-type:x proximity }
body.across .decade { display:contents }
body.across .decade h2 { grid-row:1; grid-column:var(--c) / span var(--n); margin:18px 0 6px; position:sticky; left:0; justify-self:start; padding-right:12px }
body.across .year { grid-row:2 / span 4; grid-column:var(--c); display:grid; grid-template-rows:subgrid; grid-template-columns:none; gap:0;
  padding:0 14px 10px; border-bottom:0; border-left:1px dotted var(--rule); scroll-margin:0; scroll-snap-align:start }
body.across .year > .col { padding:8px 0; border-top:1px dotted var(--rule) }
body.across #tl { background:none }
/* across: projects above the year, devices below it */
body.across .year > * { grid-area:auto; text-align:left } body.across .year > .pj .proj .sub { text-align:left }
body.across .year > .pj { grid-row:1 } body.across .year > .y { grid-row:2; padding:6px 0; border-top:2px solid var(--ink) }
/* the time line stays mid-screen: a busy year's projects and devices scroll inside their own band */
body.across .year > .pj, body.across .year > .dv { max-height:42vh; overflow-y:auto; scrollbar-width:thin }
body.across .year > .pj { align-self:end }
body.across .year > .dv { grid-row:3 } body.across .year > .ev { grid-row:4 } body.across .year > .ev h3 { display:block }
body.across .year.hide { display:none !important }
body.across details.undated { margin-top:18px }
.bar .lay { margin-left:auto }
</style>
</head>
