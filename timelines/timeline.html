 "product": "Sd405 - ISS1", "year": 2003, "family": "Obsolete products", "summary": "Issue 1 of the Serialboxx SD405: an SDI card that embeds two AES or analog stereo channels into one selectable audio group of a 270 Mb/s signal, with four SDI outputs and CD/AUDIO/ERROR tallies. Built from the May 2003 netlist, the SD405A manual and the June 2003 PIC firmware.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/sd405-iss1.png"}, "aip8-2a": {"id": "aip8-2a", "name": "AIP8-2A \u00b7 stereo + DV audio ingest processor and monitor (2007|40)", "product": "AIP8-2A", "year": 2007, "family": "Obsolete products", "summary": "2 RU aural/visual monitor and processor for a stereo (ST) and a described-video (DV) AES pair, from AES BNCs or two embedded pairs in SDI. Eight LED bargraphs show ST/DV in and out; ST and DV knobs give \u00b115 dB and source choices; a 16-character readout and eight lighted buttons run on a new ATmega128 front controller talking to the AMS8E-1 main board, Cyclone FPGA and SHARC.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the AIP8-2A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/aip8-2a.png"}, "ama": {"id": "ama", "name": "AMA \u00b7 AMA-4 audio monitor, archive view with 2002 drawings (2002|35)", "product": "AMA", "year": 2002, "family": "Obsolete products", "summary": "The archive copy of the AMA-4 \u201cAudio Monitor System\u201d: the 2002|35 front and rear silk drawings, a 2003|36 manual sketch and the obsolete DWGs. The model runs the AMS4 v2.0x firmware path with the DEMUX option that the 2002 rear shows (SD1\u2013SD8), and documents the front-panel M1 file that differs from the AMA4 folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["drawings", "Drawings & versions"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ama.png"}, "ama4": {"id": "ama4", "name": "AMA4 \u00b7 AMA-4 audio monitor system, 2016 drafting set (2016|49)", "product": "AMA4", "year": 2016, "family": "Obsolete products", "summary": "A 1RU SELECT SERIES \u201cAMA-4 Audio Monitor System\u201d: the AMS4 monitor (4 analog + 4 AES inputs, display, VU and phase meter, headset) with rear binding posts for external speakers. This model uses the 2015|48 silks and the 2016|49 M1/M2/M3 drawings; the electronics and firmware behaviour come from the sister AMS4.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["drawings", "Drawings (to scale)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ama4.png"}, "amx6": {"id": "amx6", "name": "AMX6 \u00b7 6-input mixing audio monitor (1998|31)", "product": "AMX6", "year": 1998, "family": "Obsolete products", "summary": "A 1RU Select Series monitor that mixes six balanced mono inputs, each with its own OFF\u2026+9 dB level control, into a master-controlled line output and two built-in speakers; a T/R/S headset jack mutes the speakers. Analog only: the model follows every stage from the 1998 OrCAD schematic, the 1999 PCB and the manual.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/amx6.png"}, "avm": {"id": "avm", "name": "AVM \u00b7 AVM4 audio/video monitor (2002|35)", "product": "AVM", "year": 2002, "family": "Obsolete products", "summary": "Two-rack-unit SELECT SERIES audio/video monitor: four analog, four AES (75/110 \u03a9 auto-detect) and, with the DEMUX-2 option, eight embedded SDI pairs, each tied to one of four composite inputs or the SDI picture on a built-in LCD. Three PIC16 processors share the work: the main board (display, crosspoints, CS8415A, RS-485), the AVM4-1 LED meter and the AVM4-2 video switcher.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the AVM4"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/avm.png"}, "avs": {"id": "avs", "name": "AVS \u00b7 AVS24 12 \u00d7 2 audio/video switcher board with CPLD crosspoint (1998|31\u20132006|39)", "product": "AVS", "year": 1998, "family": "Obsolete products", "summary": "The AVS24 is the board inside the RAV24 and RA24 routing switchers: a PIC scans 17 buttons and shifts 36-bit words into an Altera EPM7128S that holds the audio-mux, bus-select and video-crosspoint lines. This model runs the CPLD gate by gate from the compiler report and the PIC firmware branch by branch, so every press can be followed down to the LM1881 edge where the video cuts.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/avs.png"}, "c6201-never-produced": {"id": "c6201-never-produced", "name": "C6201 \u00b7 openGear frame controller concept (2006|39)", "product": "C6201 - NEVER PRODUCED", "year": 2006, "family": "Obsolete products", "summary": "One functional drawing from June 2006 for a card that was never sold: a controller for Ward-Beck's own openGear frame, with CAN to the cards, slot addressing, power-supply and frame 1-Wire monitoring, fan-kit enable and an AES receiver. The model shows the concept at work in the frame and links it to the board that implemented it, the FC6221A.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Controller logic (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/c6201-never-produced.png"}, "custom-e8200": {"id": "custom-e8200", "name": "E8200 \u00b7 custom MF8200 card-to-D-sub extender (2004|37)", "product": "CUSTOM - E8200", "year": 2004, "family": "Obsolete products", "summary": "Two pinout sheets for a passive module that brings an 8200-series card's 30-way edge out to a D-sub: E8200C (DB25, for CBC, M8204/M8205) and E8200D (DB37, eight D82xx cards, with power). The model traces every pin and shows the signal it carries.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Signal path (no electronics)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/custom-e8200.png"}, "demux1": {"id": "demux1", "name": "DEMUX-1 \u00b7 SDI audio de-embedder board (2001|34)", "product": "DEMUX-1", "year": 2001, "family": "Obsolete products", "summary": "Ward-Beck\u2019s first SDI de-embedder: a daughter board (CLC014/CLC016/CLC011 receiver, Gennum GS9023, PIC16F874) inside the POD19, XTM4, AMS4 and DMS1. One PIC image serves a parallel POD19 port or a 9600 Bd RS-485 host, selects one of four embedded groups and returns SDI and audio lock. The model runs the MPASM source v1.01\u2013v1.06 pass by pass against SDI lines, HANC packets and RS-485 bytes.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: driving the DEMUX-1"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/demux1.png"}, "demux2": {"id": "demux2", "name": "DEMUX-2 \u00b7 SDI audio de-embedder with composite video out (2001|34)", "product": "DEMUX-2", "year": 2001, "family": "Obsolete products", "summary": "Internal SD-SDI de-embedder board for POD19, XTM4, AMS4 and DMS1: a Gennum GS9023 pulls one audio group out of the HANC and hands it to the host on P5, while an ADV7171 re-codes the same SDI as composite video. A PIC16F874 sets the GS9023 DID registers, programs the encoder over bit-banged I2C and talks to the host over P4 lines or RS-485.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: DEMUX-2 in its hosts"], ["second", "One second, line by line"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/demux2.png"}, "demux3": {"id": "demux3", "name": "DEMUX3 \u00b7 SD/HD-SDI audio de-embedder board (2005|38)", "product": "DEMUX3", "year": 2005, "family": "Obsolete products", "summary": "The shared SD/HD-SDI de-embedder board inside XTM4, DMS1, AMS4, AMS8, AIP8-2A, POD19 and POD31: a GS1560A deserialises the cable, an Altera Cyclone EP1C12 (Quartus 5.1, top entity pod31) extracts two embedded audio groups into FIFOs and re-encodes them as AES3 on two VCXO clocks, and an ATmega128 polls its status over a 48/144-bit bit-banged chain, debounces errors into FIFO resets and answers the host over RS-485.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: testing a DEMUX-3"], ["second", "One second, line by line"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/demux3.png"}, "dms": {"id": "dms", "name": "DMS \u00b7 DMS-1 front-panel firmware archive (2001|34)", "product": "DMS", "year": 2001, "family": "Obsolete products", "summary": "The DMS-1 Digital Monitor System design archive: front-panel PIC firmware DMS1V100\u2013V102 and the 2001/2011 panel silks. This plugin assembles the archived source (matching the V102 hex backup word for word) and runs it on an emulated PIC16F73 with its USART, 93LC66B EEPROM and the XTM41 / DEMUX-1 / DEMUX-3 boards on the RS-485 bus.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/dms.png"}, "dms1": {"id": "dms1", "name": "DMS-1 \u00b7 Digital Monitor System (2001|34)", "product": "DMS1", "year": 2001, "family": "Obsolete products", "summary": "A 1RU Select Series monitor: a PIC16F73 front panel picks analog, AES or SDI-embedded audio and talks over 9600 Bd RS-485 to an XTM4 main board and a DEMUX board (DEMUX-1, -3, later -4). The model runs the DMS1V100\u2013V102 firmware routine by routine against the DEMUX-4 DMS1 build.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/dms1.png"}, "m405m": {"id": "m405m", "name": "M405M \u00b7 VU monitor panel, 2RU (1995|28)", "product": "M405M", "year": 1995, "family": "Obsolete products", "summary": "A 2RU rack panel with one illuminated VU meter, A/B input selection, a five-step input-sensitivity bank and a speaker/headset monitor amplifier. Inside are a stock SA14-292B VU-meter amplifier card and an M703C monitor amp, fed from 24 V DC.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the M405M"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m405m.png"}, "m405s": {"id": "m405s", "name": "M405S \u00b7 stereo meter turret with monitor amplifier (1996|29)", "product": "M405S", "year": 1996, "family": "Obsolete products", "summary": "A desk turret with two illuminated VU meters and a small monitor speaker. L and R push buttons pick the left channel, the right channel or their sum, and a POD-6A amplifier drives the internal shielded speaker. It runs from a 24 VDC wall transformer.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the M405S"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m405s.png"}, "m445": {"id": "m445", "name": "M445 \u00b7 Extended range meter/monitor, 68HC11 (1996|29)", "product": "M445", "year": 1996, "family": "Obsolete products", "summary": "A portable stereo VU meter that docks into a 19 in rack frame with speakers. It reads \u221260 to +30 dBu for 0 VU in 1 dB steps, set by a rotary encoder and shown on an LCD. Here the 68HC11 firmware (KS0003.ASM) is assembled and run instruction by instruction on a 68HC711E9 model, and drives the range relays, the CS3310 attenuator, the MM5453 LCD and the battery shutdown.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second (slow motion)"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m445.png"}, "m8245": {"id": "m8245", "name": "M8245 \u00b7 \u00b122 V switch-mode power supply card (2011|44 scans)", "product": "M8245", "year": 2011, "family": "Obsolete products", "summary": "An off-line half-bridge switch-mode supply on one plug-in card: TL495 PWM at 50 kHz, two MJE13007s, opto-isolated feedback, current-limit hiccup and an SCR crowbar, giving \u00b122 V. It powered WBS frames (the M8245A version in the MF100) and, inside the M8246, the R2K console.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: bench test"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Power path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8245.png"}, "m8246-r2k-console-psu": {"id": "m8246-r2k-console-psu", "name": "M8246 \u00b7 R2K console power supply (1999|32)", "product": "M8246 - R2K CONSOLE PSU", "year": 1999, "family": "Obsolete products", "summary": "The plug-in power supply for the R2K radio console: a 4.98 \u00d7 2.2 in black-fronted aluminium box that slides into the MF251/MF250 power frame. One is essential and two give redundancy, sharing the \u00b121 V bus through diodes. Inside is an M8245-type \u00b122 V switch-mode card (inferred).", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: powering the R2K"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Power path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8246-r2k-console-psu.png"}, "mf250-frame-for-r2k-psu": {"id": "mf250-frame-for-r2k-psu", "name": "MF250 \u00b7 frame for the R2K console power supplies (1999|32)", "product": "MF250 - FRAME FOR R2K PSU", "year": 1999, "family": "Obsolete products", "summary": "The rack frame (sold as the MF251) that holds one or two M8246 supplies for the R2K console, plus six ancillary slots for 8200-series DAs. Two AC inlets and fuses on the rear; a blank front for the empty supply bay. The archive copy is the 2012\u20132013 metalwork redraw set.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: assembling the frame"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Power path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mf250-frame-for-r2k-psu.png"}, "mlc6a": {"id": "mlc6a", "name": "MLC6A \u00b7 Multi-Channel Level Control, 6 channel (2007|40)", "product": "MLC6A", "year": 2007, "family": "Obsolete products", "summary": "1RU 5.1 meter and monitor level control: six channel encoders (L R C LFE LS RS) and a master with 25-LED rings, eight 22-LED bargraphs and two presets. Its firmware (front V205, main board V106) is the MLC8A code with the two hidden channels started at 120 and the input termination taken away from the panel.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the MLC6A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mlc6a.png"}, "mlc6r": {"id": "mlc6r", "name": "MLC6R \u00b7 MLC6 with built-in speakers, metalwork (2006|39)", "product": "MLC6R", "year": 2006, "family": "Obsolete products", "summary": "An MLC6 multichannel level control built into an AMS8-style chassis with two speakers and an AMS8E-81 power amp. Only the June 2006 metalwork survives: the bottom pan, its parts layout and an unnamed front strip with six channel holes and a 25-LED master encoder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: assemble & use"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software (inferred)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mlc6r.png"}, "pod10": {"id": "pod10", "name": "POD10 \u00b7 6\u00d71 AES/EBU digital audio switcher (1997|30)", "product": "POD10", "year": 1997, "family": "Obsolete products", "summary": "Half-rack six by one interlocking AES/EBU switcher: six transformer-coupled inputs, each with a DS75176 line receiver whose output is enabled by the PIC, share one bus that drives two transformer outputs. Firmware V1.03 (PIC16F73, assembly) polls six buttons, answers RS-422 at 9600 baud and is the SPI slave of a POD9 video switcher for audio-follow-video.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD10"], ["second", "One second, in slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod10.png"}, "pod11": {"id": "pod11", "name": "POD11 \u00b7 AES/EBU monitor, PIC-polled CS8412 + LM3915 bars (1997|30)", "product": "POD11", "year": 1997, "family": "Obsolete products", "summary": "Half-rack AES/EBU monitor: a CS8412 receiver feeds a CS4330 DAC for balanced, unbalanced and headset outputs, analog VU detectors drive two 20-LED bars, and a PIC16C73A turns the receiver's error and rate codes into eight status lamps while multiplexing the bars. Modelled from the archived V1.00/V1.01/V10X assembly source and the ISS3 netlist.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, pass by pass"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software (PIC)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod11.png"}, "pod12": {"id": "pod12", "name": "POD12 \u00b7 AES/EBU reclocking distribution amplifier (1999|32)", "product": "POD12", "year": 1999, "family": "Obsolete products", "summary": "Half-rack AES/EBU DA. The 2002 ISS1 (CS8412 + PIC, six outputs, EQ trim) was redesigned in 2013|46\u20132014|47 as POD12-1 ISS2, sold as the POD12A: two CS8416 receivers, an AT90CAN128, a Cyclone EP1C3 that re-encodes AES and an AD1895 SRC. Its firmware (V020000) and FPGA project are archived in this folder.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD12"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod12.png"}, "pod13": {"id": "pod13", "name": "POD13 \u00b7 dual AES/EBU D/A converter (1998|31)", "product": "POD13", "year": 1998, "family": "Obsolete products", "summary": "The original half-rack dual AES/EBU to analog converter (75 \u03a9 BNC or 110 \u03a9 XLR builds), with front LVL (+24/+18 dBu) and cable-EQ buttons and LOCK/NO LOCK tallies. Two CS8412 receivers feed CS4329 DACs. A PIC16C54A polls the receivers' error pins and drives the LEDs and the open-collector NO LOCK/CONFIDENCE tallies. Its three archived programs run here on a cycle-counting emulator.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using a POD13"], ["second", "One second, loop by loop"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software (PIC16C54A)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod13.png"}, "pod14": {"id": "pod14", "name": "POD14 \u00b7 dual A-D converter, AES/EBU out, obsolete (2001|34)", "product": "POD14", "year": 2001, "family": "Obsolete products", "summary": "The original half-rack dual analog-to-AES/EBU converter (32\u201396 kHz, internal PLL or external AES reference), predecessor of POD14A. A PIC16C73A runs the whole unit by polling: it bit-bangs two CS8420 transceivers over SPI, hunts between the 75 \u03a9 and 110 \u03a9 reference receivers, and calibrates after every change. Its V1.02 assembler is emulated pass by pass.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD14"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod14.png"}, "pod15": {"id": "pod15", "name": "POD15 \u00b7 1\u00d76 composite video DA, POD15A board (1999|32\u20132009|42)", "product": "POD15", "year": 1999, "family": "Obsolete products", "summary": "Half-rack video distribution amplifier: a bridging looping input, a level trim and seven 75 \u03a9 outputs (six rear, one front monitor). The folder holds the later POD15A issue 1 and issue 3 netlists, so this model runs on the real nets: differential input, GB4571 clamp, two-section EQ, paired drivers and a CD4538 sync one-shot.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod15.png"}, "pod16": {"id": "pod16", "name": "POD16 \u00b7 stereo audio cross-fader (1998|31)", "product": "POD16", "year": 1998, "family": "Obsolete products", "summary": "Half-rack 2 \u00d7 1 stereo fader: four SSM2018 VCAs summed into one balanced output, faded by a PIC16C73A through two LT1451 DACs. Three fade laws from 256-entry tables, a 10 ms\u20262 s FADE TIME trim (CUT since v1.01), and selection from the front panel or from WET/DRY tally inputs.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD16"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod16.png"}, "pod22": {"id": "pod22", "name": "POD22 \u00b7 stereo loudness meter, AES or analog, SHARC + PIC (2003|36)", "product": "POD22", "year": 2003, "family": "Obsolete products", "summary": "Half-rack stereo loudness meter: two 40-segment VU-plus-peak bars, a phase column and LOCK/COM/rate/ERROR tallies, fed from AES (75 or 110 \u03a9, found automatically) or analog. A PIC16F874 is emulated pass by pass (DIPs, autodetect, CS8427, RS-485 control from a POD23) and the ADSP-21065L SHARC meters every sample through the real display tables to the MM5450 bit frames.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Software (PIC + SHARC)"], ["findings", "Findings"]], "preview": ""}, "qsp": {"id": "qsp", "name": "QSP \u00b7 QSP-2 dual cue speaker, 1 RU (1998|31\u20132016|49)", "product": "QSP", "year": 1998, "family": "Obsolete products", "summary": "A 1 RU \u201cSelect Series\u201d monitor speaker: two balanced inputs, a TDA1521 power amplifier, CH 1/CH 2 level knobs, a STEREO/MONO switch and a front headset jack that mutes the speakers. Built from the 1998 ISS.3 schematic, the manual, the 2016 panel drawings and the real silks.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Signal path (no firmware)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/qsp.png"}, "ra24": {"id": "ra24", "name": "RA24 \u00b7 12 \u00d7 2 stereo audio routing switcher (2000|33\u20132012|45)", "product": "RA24", "year": 2000, "family": "Obsolete products", "summary": "The audio-only sibling of the RAV24: 12 stereo inputs switched to two outputs from lit SWR OUT and SOURCE SELECT buttons or a remote panel. The panel is the RA24 CorelDRAW silk; the behaviour follows the PIC16C73A firmware ra24v101.asm.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (from code)"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ra24.png"}, "rav-24": {"id": "rav-24", "name": "RAV 24 \u00b7 RAV24 12 \u00d7 2 audio/video switcher with breakaway (2000|33\u20132015|48)", "product": "RAV 24", "year": 2000, "family": "Obsolete p   document.querySelectorAll('#tl [data-fw]').forEach(el => {
    const [y, d] = [el.dataset.fw.slice(0, 4), el.dataset.fw.slice(5)];
    const text = ((relBy[y] || {})[d] || []).map(r => [d, r.v, r.where, r.note, r.date].join(' ')).join(' ').toLowerCase();
    el.classList.toggle('hide', !on.has('fw') || (q && !text.includes(q)));
  });
  document.querySelectorAll('.year').forEach(y => {
    const any = y.querySelector('[data-ids]:not(.hide), [data-fw]:not(.hide)') || (q && y.querySelector('.y').textContent.includes(q));
    y.classList.toggle('hide', !any);
  });
}
document.getElementById('q').addEventListener('input', applyFilters);
document.querySelectorAll('.bar input[data-f]').forEach(c => c.addEventListener('change', applyFilters));

// spaghetti: a line from each project / job to every module it uses (job_modules: listed, or named in its drawings)
const tl = document.getElementById('tl');
const NS = 'http://www.w3.org/2000/svg';
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
let chipIndex = null;
function drawWires() {
  tl.querySelector('#wires')?.remove();
  if (!document.getElementById('wireson').checked) return;
  chipIndex = {};
  tl.querySelectorAll('.chip[data-ids]').forEach(el => { if (!el.classList.contains('hide') && el.offsetParent) el.dataset.ids.split('|').forEach(id => chipIndex[id] = el); });
  const svg = document.createElementNS(NS, 'svg');
  svg.id = 'wires';
  svg.setAttribute('width', tl.scrollWidth); svg.setAttribute('height', tl.scrollHeight);
  const box = tl.getBoundingClientRect();
  tl.querySelectorAll('.proj[data-ids]').forEach(p => {
    if (p.classList.contains('hide') || !p.offsetParent) return;
    const i = byId[p.dataset.ids];
    if (!i || !(i.modules || []).length) return;
    const a = (p.querySelector(".sub") || p).getBoundingClientRect();
    const ox = tl.scrollLeft, across = document.body.classList.contains('across');
    const x1 = (across ? a.left + 20 : Math.min(a.right, a.left + 260)) - box.left + ox, y1 = (across ? a.bottom : a.top + a.height / 2) - box.top;
    const col = `hsl(${hue(i.id)} 55% 38%)`;
    new Set(i.modules.map(c => chipIndex[c]).filter(Boolean)).forEach(c => {
      const b = c.getBoundingClientRect();
      const path = document.createElementNS(NS, 'path');
      if (across) {   // down from the project to its modules' chips, in this year or later ones
        const x2 = b.left + b.width / 2 - box.left + ox, y2 = b.top - box.top, bend = Math.max(40, Math.abs(y2 - y1) * .5);
        path.setAttribute('d', `M${x1},${y1} C${x1},${y1 + bend} ${x2},${y2 - bend} ${x2},${y2}`);
      } else {
        const x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top, bend = Math.max(60, Math.abs(y2 - y1) * .25);
        path.setAttribute('d', `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`);
      }
      path.setAttribute('stroke', col);
      path.dataset.p = p.dataset.ids; path.dataset.c = c.dataset.ids;
      svg.appendChild(path);
    });
  });
  // lifelines: a console carries on when it is re-homed: join each console's entries, year after year
  const lives = {};
  tl.querySelectorAll('.proj[data-life]').forEach(p => { if (!p.classList.contains('hide') && p.offsetParent) (lives[p.dataset.life] = lives[p.dataset.life] || []).push(p); });
  Object.entries(lives).forEach(([n, ps], lane) => {   // each console its own lane and colour in the margin
    for (let k = 1; k < ps.length; k++) {
      const a = ps[k - 1].getBoundingClientRect(), b = ps[k].getBoundingClientRect(), ox = tl.scrollLeft;
      const path = document.createElementNS(NS, 'path');
      if (document.body.classList.contains('across')) {   // an arc over the years between, each console its own height
        const y = Math.min(a.top, b.top) - box.top - 6 - (lane % 6) * 5, x1 = a.left + 10 - box.left + ox, x2 = b.left + 10 - box.left + ox;
        path.setAttribute('d', `M${x1},${a.top - box.top} C${x1},${y - 16} ${x2},${y - 16} ${x2},${b.top - box.top}`);
      } else {
        const x = Math.min(a.left, b.left) - box.left - 8 - (lane % 6) * 5, y1 = a.top + 10 - box.top, y2 = b.top + 10 - box.top;
        path.setAttribute('d', `M${a.left - box.left},${y1} C${x - 16},${y1} ${x - 16},${y2} ${b.left - box.left},${y2}`);
      }
      path.setAttribute('class', 'lifeline');
      path.style.stroke = `hsl(${hue(n)} 50% 36%)`;
      path.dataset.p = ps[k].dataset.ids; path.dataset.c = '';
      svg.appendChild(path);
    }
  });
  tl.appendChild(svg);
}
function focusWires(el) {
  const svg = tl.querySelector('#wires');
  tl.querySelectorAll('.lit').forEach(x => x.classList.remove('lit'));
  if (!svg) return;
  svg.classList.toggle('focus', !!el);
  svg.querySelectorAll('path').forEach(p => p.classList.remove('on'));
  if (!el) return;
  const key = el.dataset.ids, isProj = el.classList.contains('proj');
  svg.querySelectorAll('path').forEach(p => {
    if ((isProj ? p.dataset.p : p.dataset.c) !== key) return;
    p.classList.add('on');
    tl.querySelectorAll(isProj ? '.chip[data-ids]' : '.proj[data-ids]').forEach(x => { if (x.dataset.ids === (isProj ? p.dataset.c : p.dataset.p)) x.classList.add('lit'); });
  });
  el.classList.add('lit');
}
tl.addEventListener('mouseover', e => { const t = e.target.closest('.proj[data-ids], .chip[data-ids]'); if (t) focusWires(t); });
tl.addEventListener('mouseleave', () => focusWires(null));
let wt; const redraw = () => { clearTimeout(wt); wt = setTimeout(drawWires, 120); };
window.addEventListener('resize', redraw);
tl.addEventListener('scroll', redraw, true);   // a band scrolled inside its year: its lines follow
document.getElementById('wireson').addEventListener('change', drawWires);
document.getElementById('q').addEventListener('input', redraw);
document.querySelectorAll('.bar input[data-f]').forEach(c => c.addEventListener('change', redraw));
// across: the wheel turns the timeline's pages left and right while there is more of it that way
tl.addEventListener('wheel', e => {
  if (!document.body.classList.contains('across') || e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  const max = tl.scrollWidth - tl.clientWidth;
  if ((e.deltaY > 0 && tl.scrollLeft < max - 1) || (e.deltaY < 0 && tl.scrollLeft > 0)) { e.preventDefault(); tl.scrollLeft += e.deltaY; }
}, { passive: false });
const lay = document.getElementById('across');
try { if (localStorage.getItem('wbs-timeline-down') === '1') lay.checked = false; } catch {}
const setLayout = () => {
  document.body.classList.toggle('across', lay.checked);
  try { localStorage.setItem('wbs-timeline-down', lay.checked ? '0' : '1'); } catch {}
  drawWires();
};
lay.addEventListener('change', setLayout);
document.getElementById('decades').addEventListener('click', e => {   // across: a decade link slides the timeline there
  const a = e.target.closest('a');
  if (!a || !lay.checked) return;
  e.preventDefault();
  const h = document.getElementById(a.getAttribute('href').slice(1));
  const first = h ? [...tl.querySelectorAll('.year')].find(x => x.style.getPropertyValue('--c').trim() === h.style.getPropertyValue('--c').trim()) : null;
  if (first) tl.scrollTo({ left: first.offsetLeft - tl.offsetLeft, behavior: 'smooth' });
});
document.body.classList.toggle('across', lay.checked);
document.fonts?.ready.then(drawWires); drawWires();
</script>
