<script>
const svg = document.querySelector('#stage svg'), stage = document.getElementById('stage'), tip = document.getElementById('tip');
const home = svg.viewBox.baseVal; let vb = {x:home.x, y:home.y, w:home.width, h:home.height}, flipped = false;
const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const box = document.getElementById('layers');
svg.querySelectorAll('g.layer').forEach(g => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" ${g.dataset.default === 'off' ? '' : 'checked'}><span class="sw" style="background:${g.dataset.color}"></span>${g.dataset.name}`;
  l.querySelector('input').onchange = e => g.style.display = e.target.checked ? '' : 'none';
  if (g.dataset.default === 'off') g.style.display = 'none';
  g.removeAttribute('display'); box.appendChild(l);
});
const setAll = on => box.querySelectorAll('input').forEach(i => { i.checked = on; i.onchange({target:i}); });
document.getElementById('all').onclick = () => setAll(true);
document.getElementById('none').onclick = () => setAll(false);
document.getElementById('fit').onclick = () => { vb = {x:home.x, y:home.y, w:home.width, h:home.height}; apply(); };
document.getElementById('flip').onclick = () => { flipped = !flipped; svg.style.transform = flipped ? 'scaleX(-1)' : ''; };
let drag = null;
stage.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y}; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointerup', () => drag = null);
stage.addEventListener('pointermove', e => {
  if (drag) { const s = vb.w / stage.clientWidth * (flipped ? -1 : 1); vb.x = drag.vx - (e.clientX - drag.x) * s; vb.y = drag.vy - (e.clientY - drag.y) * vb.h / stage.clientHeight; apply(); }
  const t = e.target.closest('rect,circle'); const title = t && t.querySelector('title');
  if (title) { tip.textContent = title.textContent; tip.style.display = 'block'; tip.style.left = (e.offsetX + 14) + 'px'; tip.style.top = (e.offsetY + 10) + 'px'; }
  else tip.style.display = 'none';
});
stage.addEventListener('wheel', e => {
  e.preventDefault(); const k = e.deltaY > 0 ? 1.2 : 1 / 1.2, r = stage.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  vb.x += vb.w * (1 - k) * (flipped ? 1 - fx : fx); vb.y += vb.h * (1 - k) * fy; vb.w *= k; vb.h *= k; apply();
}, {passive:false});
