<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ward-Beck Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  --desk:#2b2a27; --paper:#fbfaf4; --ink:#1f1e1c; --faint:#6d6a63; --rule:#d6d0c0; --link:#1f3f6b; --hl:#f3ecd2;
  --job:#a8442a; --project:#7a5a2e; --event:#1f3f6b;
  --c-in:#2f6f8f; --c-flt:#3f7f4f; --c-dyn:#8f4f2f; --c-sum:#5f4f8f; --c-rte:#2f7f7f; --c-mon:#7f6f2f; --c-met:#8f2f4f;
  --c-amp:#4f6f2f; --fw:#0f6b6b; --c-sim:#2d6a4f; --c-pow:#6f4f4f; --c-log:#4f5f6f; --c-com:#2f5f9f; --c-con:#6f3f7f; --c-prod:#3f6f8f; --c-oth:#6d6a63;
}
* { box-sizing:border-box }
html { background:var(--desk) }
body { margin:0; padding:24px 16px 60px; color:var(--ink); font:15px/1.5 "Courier Prime","Courier New",Courier,monospace }
.sheet { max-width:1100px; margin:0 auto; background:var(--paper); padding:clamp(20px,4vw,48px) clamp(16px,5vw,56px) 48px;
  box-shadow:0 1px 0 #d8d4c6, 0 18px 40px rgba(0,0,0,.5) }
.top { display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--faint); margin-bottom:14px }
a { color:var(--link); text-underline-offset:3px; text-decoration-thickness:1px } a:hover { background:var(--hl) }
h1 { font-size:22px; margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em; text-decoration:underline; text-underline-offset:6px }
.lede { color:var(--faint); max-width:78ch; margin:8px 0 16px }
.bar { position:sticky; top:0; z-index:5; background:var(--paper); padding:10px 0 8px; border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center }
.bar input[type=search] { font:inherit; border:0; border-bottom:1.5px solid var(--ink); background:transparent; width:22ch; padding:0 4px }
.bar label { white-space:nowrap; cursor:pointer } .bar label input { accent-color:var(--ink) }
.decades { display:flex; flex-wrap:wrap; gap:4px 10px; width:100% } .decades a { font-weight:700 }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--faint); font-size:13px; margin:12px 0 0 }
.legend span { display:inline-flex; align-items:center; gap:5px }
.sw { width:12px; height:12px; border-radius:2px; display:inline-block }
.sw.est { background:transparent !important; border:1.5px dashed var(--ink) }
.decade h2 { font-size:18px; margin:30px 0 4px; text-transform:uppercase; text-decoration:underline; text-underline-offset:5px; scroll-margin-top:110px }
/* a spine down the middle: projects on the left, the year and its events in the centre, devices on the right */
.year { display:grid; grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr); grid-template-areas:"pj y dv" "pj ev dv" "pj fw dv";
  grid-template-rows:auto auto 1fr; gap:4px 18px; padding:10px 0; border-bottom:1px dotted var(--rule); scroll-margin-top:110px }
.year > .y { grid-area:y; font-weight:700; font-size:18px; text-align:center }
.year > .pj { grid-area:pj; text-align:right } .year > .pj .proj .sub { text-align:right }
.year > .dv { grid-area:dv } .year > .ev { grid-area:ev; text-align:center; font-size:13px }
.year > .fw { grid-area:fw; text-align:center } .year > .fw .chips { justify-content:center } .year > .fw .empty { display:none }
.year > .ev h3 { display:none } .year > .ev .ev::before { content:"" } .year > .ev .empty { display:none }
#tl:not(:empty) { background:linear-gradient(var(--rule), var(--rule)) center top / 1px 100% no-repeat }
#tl { position:relative }
#wires { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:1 }
#wires path { fill:none; stroke-width:1.2; opacity:.22; transition:opacity .15s }
#wires path.lifeline { stroke:var(--project); stroke-width:2.2; stroke-dasharray:6 4; opacity:.75 }
#wires.focus path { opacity:.04 } #wires.focus path.on { opacity:.95; stroke-width:2 }
.proj.life b::before { content:"⟲ "; color:var(--faint) }
.proj.lit, .chip.lit { outline:2px solid var(--ink); outline-offset:1px }
.col h3 { margin:0 0 4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400 }
.proj { margin:0 0 5px; cursor:pointer } .proj b { color:var(--job) } .proj.p b { color:var(--project) }
.proj .sub { display:block; font-size:12.5px; color:var(--faint) }
.chips { display:flex; flex-wrap:wrap; gap:4px }
.chip { font:inherit; font-size:12.5px; border:0; border-radius:3px; padding:1px 6px; color:#fff; cursor:pointer; line-height:1.5 }
.chip.medium { opacity:.82 } .chip.est { background:transparent !important; outline:1.5px dashed currentColor; outline-offset:-1.5px }
.chip .n { opacity:.85; font-size:11px }
.chip.fw { background:var(--fw) } .chip.fw .n::before { content:"·" }
.chip .s { font-size:10px; margin-left:3px; opacity:.9 }   /* ▶ it has a simulation */
#fwbars { margin:14px 0 0 } #fwbars h3 { margin:0 0 2px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400 }
#fwbars svg { width:100%; height:92px; display:block } #fwbars rect.b { fill:var(--fw); cursor:pointer } #fwbars rect.b:hover { fill:var(--ink) }
#fwbars rect.s { fill:var(--c-sim); opacity:.35; cursor:pointer } #fwbars text { font:10px "Courier Prime",monospace; fill:var(--faint) }
#card .prev { display:block; margin:8px 0; background:#26282b; padding:4px; text-align:center } #card .prev img { max-width:100%; max-height:170px }
#card .tabs a { margin-right:8px; white-space:nowrap } #card ol.rel { margin:6px 0; padding-left:18px } #card ol.rel li { margin:0 0 5px }
#card ol.rel .d { color:var(--faint); font-size:12.5px }
.ev { margin:0 0 4px; cursor:pointer } .ev::before { content:"▸ "; color:var(--event) }
.empty { color:#b9b3a3 }
.hide { display:none !important }
details.undated { margin-top:28px } details.undated summary { cursor:pointer; font-weight:700 }
#card { position:fixed; right:16px; bottom:16px; width:min(380px, calc(100vw - 32px)); max-height:70vh; overflow:auto; background:var(--paper);
  border:1px solid var(--ink); box-shadow:0 10px 30px rgba(0,0,0,.35); padding:14px 16px; display:none; z-index:10 }
#card h4 { margin:0 24px 4px 0; font-size:16px } #card .x { position:absolute; right:10px; top:6px; border:0; background:none; font:inherit; font-size:18px; cursor:pointer }
#card dl { display:grid; grid-template-columns:max-content 1fr; gap:2px 10px; margin:8px 0 } #card dt { color:var(--faint) } #card dd { margin:0; word-break:break-word }
@media (max-width:760px) { .year { grid-template-columns:1fr; grid-template-areas:"y" "pj" "dv" "ev" "fw"; grid-template-rows:none; gap:6px }
  .year > .y { font-size:20px; text-align:left } .year > .pj, .year > .pj .proj .sub, .year > .ev { text-align:left } #tl { background:none } }
.foot { margin-top:36px; text-align:center; color:var(--faint); font-size:13px }
/* across: the timeline unfolds left to right, one column a year, its projects, devices and events in bands */
body.across .sheet { max-width:none }
body.across #tl { display:grid; grid-auto-flow:column; grid-template-rows:repeat(6, auto); grid-auto-columns:minmax(150px, 230px);
  overflow-x:auto; overscroll-behavior-x:contain; padding-bottom:14px; scroll-snap-type:x proximity }
body.across .decade { display:contents }
body.across .decade h2 { grid-row:1; grid-column:var(--c) / span var(--n); margin:18px 0 6px; position:sticky; left:0; justify-self:start; padding-right:12px }
body.across .year { grid-row:2 / span 5; grid-column:var(--c); display:grid; grid-template-rows:subgrid; grid-template-columns:none; gap:0;
  padding:0 14px 10px; border-bottom:0; border-left:1px dotted var(--rule); scroll-margin:0; scroll-snap-align:start }
body.across .year > .col { padding:8px 0; border-top:1px dotted var(--rule) }
body.across #tl { background:none }
/* across: projects above the year, devices below it */
body.across .year > * { grid-area:auto; text-align:left } body.across .year > .pj .proj .sub { text-align:left }
body.across .year > .pj { grid-row:1 } body.across .year > .y { grid-row:2; padding:6px 0; border-top:2px solid var(--ink) }
/* the time line stays mid-screen: a busy year's projects and devices scroll inside their own band */
body.across .year > .pj, body.across .year > .dv { max-height:42vh; overflow-y:auto; scrollbar-width:thin }
body.across .year > .pj { align-self:end }
body.across .year > .dv { grid-row:3 } body.across .year > .ev { grid-row:4 } body.across .year > .ev h3 { display:block }
body.across .year > .fw { grid-row:5; text-align:left; max-height:30vh; overflow-y:auto; scrollbar-width:thin } body.across .year > .fw .chips { justify-content:flex-start }
body.across .year > .fw .empty { display:inline }
body.across .year.hide { display:none !important }
body.across details.undated { margin-top:18px }
.bar .lay { margin-left:auto }
</style>
</head>

channel audio monitor (2009|42)", "product": "AMS8-2", "year": 2009, "family": "Monitors, meters & tools", "summary": "2 RU eight-channel audio monitor: eight 46-LED VU/PPM bargraphs, three 8-character displays, Dolby E / AC-3 metadata, speaker presets. A front-panel ATmega128 runs the menus and an ASCII UART link. An ADSP-21065L SHARC meters every sample and strobes the LED bars itself.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the AMS8-2"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ams82.png"}, "ams81": {"id": "ams81", "name": "AMS8-1A \u00b7 8-channel audio monitor (2013|46)", "product": "AMS8-1 (AMS8E)", "year": 2013, "family": "Monitors, meters & tools", "summary": "1RU eight-channel aural/visual monitor: eight 22-segment VU+PPM bar graphs, an 8-character display, speakers and preset mixes over four AES pairs (75 \u03a9 and 110 \u03a9 banks). Four processors: front ATmega128 (UI), main ATmega128 (protocol, Dolby card, FPGA chain), Cyclone IV FPGA (AES receive/SRC, routing) and an ADSP-21065L SHARC (mixing and meters). Variants 1A, 1AA, 1AEM, 1AN, 1BAEM, 1CAM.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the AMS8-1"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ams81.png"}, "ams16": {"id": "ams16", "name": "AMS16 \u00b7 16-channel SDI audio monitor (2008|41)", "product": "AMS16", "year": 2008, "family": "Monitors, meters & tools", "summary": "2RU embedded-audio monitor: de-embeds 8 AES pairs from SD/HD/3G-SDI onto 16 LED VU/PPM meters, with speakers, solo, summing, Lt/Rt downmix and Dolby E/AC-3 decoding. Four processors: front-panel ATmega128 (UI), main ATmega128 (SDI and FPGA control), Cyclone IV FPGA (de-embedding, AES out) and ADSP-21262 SHARC (metering, mixing, LED drive).", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the AMS16"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ams16.png"}, "demux4": {"id": "demux4", "name": "SA-DEMUX4 \u00b7 3G/HD/SD-SDI audio de-embedder (2013|46)", "product": "SA-DEMUX4 / DEMUX-4", "year": 2013, "family": "Monitors, meters & tools", "summary": "Board-level 3G/HD/SD-SDI de-embedder: a Spartan-6 receives SDI, pulls two audio groups out of HANC and re-encodes them as AES3; an ATmega128L boots it, tunes the Si5324/Si5335 clocks over bit-banged SPI, debounces lock and audio, lights three LEDs and reads an 8-way DIP switch (stand-alone) or a host UART (AMS4/AMS8/XTM4).", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the DEMUX-4"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/demux4.png"}, "xtm4": {"id": "xtm4", "name": "XTM4 \u00b7 Extended Range Test Meter (2001|34)", "product": "XTM4", "year": 2001, "family": "Monitors, meters & tools", "summary": "2RU analog / AES-3 / SDI test meter with VU and PPM needle pairs, an 8-LED phase meter and an 8-character display. Two PIC16 processors on a 9600 Bd RS-485 link: XTM42 (front panel, UI master) and XTM41 (main board: CS8420 AES receiver, CS3310 attenuator, relays).", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the XTM4"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/xtm4.png"}, "pod14a": {"id": "pod14a", "name": "POD14A \u00b7 dual A-D converter, AES/EBU out (2008|41)", "product": "POD14A", "year": 2008, "family": "POD series", "summary": "Half-rack dual analog-to-AES/EBU converter: two AK5394A ADCs at 32\u2013192 kHz from an internal clock or an external AES reference. ATmega128 (step switch, LEDs, CS8416 lock, reference scan, ADC resets) + Cyclone EP1C3 (clocks, AES3 framing), firmware cloned from the D6203 openGear card.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the POD14A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/pod14a.png"}, "mlc8": {"id": "mlc8", "name": "MLC8A \u00b7 Multi-Channel Level Control (2007|40)", "product": "MLC8A (MLC8 / MLC6 family)", "year": 2007, "family": "Monitors, meters & tools", "summary": "1RU 5.1+2 meter and monitor level control: eight channel encoders and a master with 25-LED rings, 22-LED bargraphs, presets, 5.1/ST and 75/110 \u03a9 select. Front ATmega128 + Cyclone II LED glue, AMS8-1 main board (ATmega128 + ADSP-21065L SHARC).", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the MLC8A"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mlc8.png"}, "slm": {"id": "slm", "name": "SLM-1D \u00b7 stereo loudness meter (2007|40)", "product": "SLM-1D (SLM series)", "year": 2007, "family": "Monitors, meters & tools", "summary": "Desktop VU + PPM stereo LED meter for AES audio: two 57-LED bars, sticky peak hold, 9-LED phase correlation and lock status. Modelled sample by sample: ADSP-21262 + CS8416 on the SLM1-5 board (firmware v102), three MM5450 drivers on the SLM1-4 head, with the 2002 ADSP-21065L engine for comparison.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the SLM-1D"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/slm.png"}, "opengear": {"id": "opengear", "name": "openGear series \u00b7 D6203A A\u2192D converter (2008|41)", "product": "openGear cards \u2014 D6203A (Ross ADC-8432 / Cobalt 9345)", "year": 2008, "family": "openGear", "summary": "Ward-Beck\u2019s openGear card range, with the D6203A stereo analog\u2192AES converter fully modelled: AT90CAN128 super-loop and CAN interrupts talking to DashBoard through the frame controller, an EP1C3 FPGA that measures the reference rate and builds AES3, and an AK5394A converter. Real ISS4 gerber artwork, four rear modules, a working parameter window and the bootloader upload path.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: install, DashBoard, upgrade"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["series", "Series"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/opengear.png"}, "premo": {"id": "premo", "name": "PREmo RD88 \u00b7 AES67 mic preamp + Pre-Mote (2016|49)", "product": "PREmo (RD88-MICpre)", "year": 2016, "family": "R&D register", "summary": "One-channel AES67/Ravenna microphone preamp: THAT1580 + THAT5171 digital gain, AK5572 ADC, Archwave uNet Mini, PoE. An STM32F070 drives an SSD1306 OLED and a push-turn encoder, and takes UDP commands from the VB.NET Pre-Mote app over the uNet's ARC serial link.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: PREmo + Pre-Mote"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/premo.png"}, "abb1": {"id": "abb1", "name": "ABB-1 \u00b7 Audio Bit Buddy AES monitor (1997|30)", "product": "ABB-1 Audio Bit Buddy", "year": 1997, "family": "Monitors, meters & tools", "summary": "Beltpack AES/EBU, S/PDIF and analog monitor: CS8412/CS8414 receiver, CS4330 DAC, 12-LED stereo bargraph and 8 dual-legend status/error LEDs, driven by a PIC16F73 running hand-written MPASM (v1.00\u20131.03). The archived source runs instruction by instruction in this model.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the ABB-1"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/abb1.png"}, "abs1": {"id": "abs1", "name": "ABS-1 \u00b7 Audio Bit Spitter (1998|31)", "product": "ABS-1 Audio Bit Spitter", "year": 1998, "family": "Monitors, meters & tools", "summary": "Battery-powered AES/EBU and analog tone generator. A PIC16F73 scans eight lighted buttons and sets eight select lines. An EPM7064 CPLD clocks pre-computed 24-bit sine tables out of a 27512 EPROM into a CS8402A transmitter and a CS4330 DAC. It can lock to an external AES reference through a CS8412.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the ABS-1"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/abs1.png"}, "mp8100": {"id": "mp8100", "name": "MP 8100 meter panels \u00b7 rack VU/PPM meter panels (1996|29)", "product": "MP 8100 meter panels", "year": 1996, "family": "Monitors, meters & tools", "summary": "Two-unit 19\u2033 meter panels on the 8100 chassis carrying one to four Sifam VU or PPM meters. VU meters run from the SA-MP4-1 power-supply and buffer board through 3K6 build-outs; each PPM carries a 14-060 PPM driver. Drawings date from 1996|29 to 2016|49.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second: VU vs PPM"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mp8100.png"}, "qubeamp": {"id": "qubeamp", "name": "QubeAmp \u00b7 class-D amplifier PCBA, UNI-AMP-ISS3 (2015|48)", "product": "QubeAmp", "year": 2015, "family": "Monitors, meters & tools", "summary": "The QubeAmp is a \u201cUniversal Amplifier Board\u201d with an AES receiver and DAC (CS8416, PCM5100A), an NE5532 mixer and a TPA3124D2 class-D stage. The same PCB is built two ways: bridged mono for the QUBE speaker, or stereo single-ended for the AMS2. The model follows the signal from AES frame to PWM to speaker for either build.", "depth": "Hardware model", "tabs": [["sim", "Simulator (bench)"], ["tutorial", "Tutorial"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path & BOMs"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/qubeamp.png"}, "qtp": {"id": "qtp", "name": "QTP \u00b7 DB25 \u2194 RJ45 quad-twisted-pair adapters (2015|48)", "product": "QTP adapters", "year": 2015, "family": "Monitors, meters & tools", "summary": "Passive adapter boards that carry eight balanced channels from a DB25 over two Cat5 cables, one channel per twisted pair. One production panel holds three male TASCAM boards, a shielded male, a female and a Yamaha-pinout board. Pins can be traced end to end, and the cable model shows what the run does to analog and AES signals.", "depth": "Hardware model", "tabs": [["sim", "Simulator (pin tracer)"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path & revisions"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/qtp.png"}, "ppm-driver": {"id": "ppm-driver", "name": "PPM Driver 14-060 \u00b7 discrete PPM meter driver (2015|48)", "product": "PPM Driver 14-060 (RD81)", "year": 2015, "family": "Monitors, meters & tools", "summary": "Analog board that turns a balanced line into Sifam PPM ballistics: difference amp, precision full-wave rectifier, a six-transistor dB-linear shaper and a 1 ms / 2.2 s peak detector driving a 1 mA movement. Issue 5 (RD81) is the 2015|48 surface-mount redesign.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up"], ["second", "One second & ballistics"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/ppm-driver.png"}, "amx9a": {"id": "amx9a", "name": "AMX9A \u00b7 9-input analog mixing monitor (2009|42)", "product": "AMX9A", "year": 2009, "family": "Obsolete products", "summary": "A 1RU analog monitor that mixes nine balanced mono inputs, each with its own level knob, into balanced LINE and MONITOR outputs, a built-in LM4766 speaker amplifier and a headset jack that mutes the speakers. Modelled stage by stage from the P-CAD netlists of all three board issues.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram & board"], ["schematic", "Schematics (redrawn)"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/amx9a.png"}, "32me": {"id": "32me", "name": "32ME \u00b7 MADI / network 32-meter audio monitor (2013|46)", "product": "32ME", "year": 2013, "family": "Monitors, meters & tools", "summary": "A 1RU, 32-meter audio monitor for 16 AES pairs, a 64-channel MADI stream (DirectOut i64 module, 32ME-MADI) or a RAVENNA network feed (Archwave uNet, 32ME-N). One knob drives the menus. A SHARC runs the VU and PPM ballistics and multiplexes four AMS8E-4 LED boards.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: using the 32ME"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/32me.png"}, "d8200": {"id": "d8200", "name": "D8200 \u00b7 AES DSP platform for D8205/6/7/8 (2000|33)", "product": "D8200", "year": 2000, "family": "8200 Distribution Series", "summary": "One board \u2014 PIC16C73, EPM7128S CPLD, ADSP-21061 SHARC and two CS8420s \u2014 that becomes the D8205 mixer/level DA, D8206 tone generator, D8207 SRC or D8208 level DA depending on one #define. The model runs the v1.104 PIC firmware pass by pass: jumpers, lock, clock plans, the SHARC handshake and the delayed output enable.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8200.png"}, "d8202": {"id": "d8202", "name": "D8202 \u00b7 AES/EBU to analog converter card (2005|38)", "product": "D8202", "year": 2005, "family": "8200 Distribution Series", "summary": "MF82 plug-in card that converts one AES/EBU input to three balanced analog stereo outputs, or two stereo plus two mono. A PIC16C54 running V1.00 (2005|38) configures and polls a CS8427 receiver over bit-banged SPI. A CS4390 DAC feeds jumper-ranged, trimmed OP275 line drivers.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up a D8202"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8202.png"}, "d8203": {"id": "d8203", "name": "D8203 \u00b7 Analog to AES/EBU converter (1998|31)", "product": "D8203", "year": 1998, "family": "8200 Distribution Series", "summary": "Stereo analog to 24-bit AES/EBU converter card for the MF82 frame, with four outputs and an internal 48/44.1/32 kHz clock or lock to an external AES reference. The 1998 PIC firmware runs here instruction by instruction: its two-pass self-calibration takes 25 s at power-up and about 7 s at every reference change, exactly as the 1998 manual says.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8203.png"}, "d8204": {"id": "d8204", "name": "D8204 \u00b7 AES/EBU reclocking DA (1998|31)", "product": "D8204", "year": 1998, "family": "8200 Distribution Series", "summary": "One AES/EBU input on 75 \u03a9 coax, equalised, re-timed and fanned out to eight 75 \u03a9 outputs on an MF82 frame card. The 2012 manual board runs the D8204B PIC firmware, which polls a CS8420 every 1.8 ms, drives the LOCK/NO LOCK LEDs and mutes the outputs on loss.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8204.png"}, "d8204a": {"id": "d8204a", "name": "D8204A \u00b7 AES/EBU reclocking DA + D/A converter (2005|38)", "product": "D8204A", "year": 2005, "family": "8200 Distribution Series", "summary": "MF82 frame card: one 75 \u03a9 AES/EBU input, cable EQ, a CS8427 receiver that re-times it to four 75 \u03a9 outputs, and a DAC feeding two balanced analog stereo pairs. The archived PIC firmware (v100, 2005|38) is for the ISS1 board with a DIP switch for reference level and routing; the shipping ISS3 board used a PIC16C54 whose code is lost.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8204a.png"}, "d8204b": {"id": "d8204b", "name": "D8204B \u00b7 AES/EBU reclocking DA, 1\u00d78, 75 \u03a9 (2005|38)", "product": "D8204B", "year": 2005, "family": "8200 Distribution Series", "summary": "MF82 plug-in card that receives one AES/EBU feed on 75 \u03a9 coax, reclocks it through a CS8427 transceiver and drives eight 75 \u03a9 outputs. A PIC16F874 rewrites the CS8427 every 1.6 ms, reads its UNLOCK bit, drives the LOCK / NO LOCK LEDs and an alarm, and switches the transmitter off when the input is lost.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: installing the card"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8204b.png"}, "d8204c": {"id": "d8204c", "name": "D8204C \u00b7 110 \u03a9 AES DA with analog outputs (2006|39)", "product": "D8204C", "year": 2006, "family": "8200 Distribution Series", "summary": "A 110 \u03a9 AES/EBU distribution card for the TB8201AP screw-terminal module: one input, four transformer-coupled AES outputs, and a CS4390 DAC feeding balanced left/right analog outputs. A PIC16C54 (code not archived) watches the receiver, mutes the DAC and drives the LEDs and alarm.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8204c.png"}, "d8205": {"id": "d8205", "name": "D8205 \u00b7 adjustable-gain AES DA with SRC (1999|32)", "product": "D8205", "year": 1999, "family": "8200 Distribution Series", "summary": "MF82 plug-in card: two AES inputs, digital trim or volume on front-edge pots, mono, mix and a 1 kHz tone routed to two outputs, with sample-rate conversion to either input or an internal 48 kHz. A PIC16C73A, an EPM7128 CPLD, two CS8420s and an ADSP-21061 SHARC share the work, all set by 14 jumpers.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up a D8205"], ["second", "One second, layer by layer"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8205.png"}, "d8206": {"id": "d8206", "name": "D8206 \u00b7 DARS / AES reference tone generator (2000|33)", "product": "D8206", "year": 2000, "family": "8200 Distribution Series", "summary": "An MF82 card that makes two AES reference outputs (tone or digital silence, two copies each) and a word clock, locked to an AES reference, NTSC black or an internal 48 kHz. It is the shared D820x platform (PIC, EPM7128S, ADSP-21061, two CS8420s, ML6431) built with #define D8206.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8206.png"}, "d8207": {"id": "d8207", "name": "D8207 \u00b7 AES sample-rate converter (1999|32)", "product": "D8207", "year": 1999, "family": "8200 Distribution Series", "summary": "A 24-bit AES/EBU sample-rate converter card for the MF82 frame: two CS8420s (main converter and reference receiver), an optional ML6431 video genlock (D8207V) and a PIC16C73A that bit-bangs I2C to all three. With no reference it is a reclocking distribution amplifier. The model runs the V1.01 firmware routine by routine from power-on.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8207.png"}, "d8208": {"id": "d8208", "name": "D8208 \u00b7 Adjustable-gain AES DA (2000|33)", "product": "D8208", "year": 2000, "family": "8200 Distribution Series", "summary": "A 1-in, 8-out AES distribution amplifier with \u00b115 dB trim or off\u2026+12 dB volume, set by PCB or remote pots. It is the shared D820x platform (PIC16C73A, EPM7128S, ADSP-21061, CS8420) built with #define D8208.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8208.png"}, "d8210-d8212": {"id": "d8210-d8212", "name": "MF8210 / MF8212 \u00b7 DA frames (2016|49)", "product": "D8210 & D8212", "year": 2016, "family": "8200 Distribution Series", "summary": "The 2-RU rack frames that hold every 8200-series card: 12 slots (MF8212) or 10 deeper slots (MF8210), redundant \u00b122 V supplies, a frame reference bus and a rear housing for termination modules. Built from the 2016|49 drafting masters and real door and power-cover silkscreens.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Power & signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d8210-d8212.png"}, "m8200-terminations": {"id": "m8200-terminations", "name": "M8200 \u00b7 Termination modules (1997\u20132005|30\u201338)", "product": "M8200 - TERMINATIONS", "year": 1998, "family": "8200 Distribution Series", "summary": "The rear termination family for 8200-series cards: screw, pluggable, solder, quick-connect and BNC modules that plug into the frame backplane with a 20-way connector. Try 60 \u03a9 and 600 \u03a9 build-outs into real loads, BNC loop-through, and the misfiled \u201cAudio Bit Spitter\u201d test board.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8200-terminations.png"}, "m8200-extender-handle": {"id": "m8200-extender-handle", "name": "M8200 \u00b7 E8200D extender, handle, BNC terminations (2005|38)", "product": "M8200 Extender, handle", "year": 2005, "family": "8200 Distribution Series", "summary": "Service and connection parts shared by every 8200-series card: the E8200D extender that runs a card outside the frame, the M8200-004 card handle, and the BNC1\u2013BNC4 rear termination boards. Probe any edge contact of a card on the extender and wire the BNC loop correctly.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Drawings"], ["software", "Pin & signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8200-extender-handle.png"}, "m8201": {"id": "m8201", "name": "M8201 \u00b7 Announce channel control module (1996|29)", "product": "M8201", "year": 1996, "family": "8200 Distribution Series", "summary": "An announce-channel control card known only from its 1996|29 functional drawing: a balanced input feeds an always-live intercom output and a latched, switched programme output, with CHANNEL ON / TOGGLE / OFF inputs, tally sinks and an external relay. The diagram here is decoded straight from the DWG file.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Drawing"], ["software", "Control logic"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8201.png"}, "m8202a": {"id": "m8202a", "name": "M8202A \u00b7 Remote-sensitivity analog DA (1998|31)", "product": "M8202A", "year": 1998, "family": "8200 Distribution Series", "summary": "A balanced 1-in, 8-out analog audio DA whose gain can be swung over 30 dB by a remote pot up to 300 m away, through an SSM2018 VCA. Set it up exactly as the manual describes with the real trims on the 14-212 board, and watch headroom and clipping through each stage.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8202a.png"}, "m8202b": {"id": "m8202b", "name": "M8202B \u00b7 Remote-sensitivity DA, 600 \u03a9 (1998|31)", "product": "M8202B", "year": 1998, "family": "8200 Distribution Series", "summary": "The 600 \u03a9 version of Ward-Beck's remote-sensitivity analog distribution amplifier: \u00b115 dB of gain set locally or by a 10 k pot up to 1000 ft away. Run the manual's set-up with the real trims on the 14-212 board, turn the remote pot and watch the VCA follow.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8202b.png"}, "m8202rc": {"id": "m8202rc", "name": "M8202RC \u00b7 Remote sensitivity control panel (1998|31)", "product": "M8202RC", "year": 1998, "family": "8200 Distribution Series", "summary": "The twelve-pot remote panel for the M8202 remote-sensitivity DAs: each 10 k pot is wired through a 38-pin EDAC plug to a card's REM IN. Both AutoCAD wiring drawings are redrawn from their R12 files; turn pots, trace pins and watch twelve cards follow.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8202rc.png"}, "m8203": {"id": "m8203", "name": "M8203 \u00b7 Analog reference oscillator (1993|26)", "product": "M8203", "year": 1993, "family": "8200 Distribution Series", "summary": "The 8200-series line-up tone card: a Wien-bridge oscillator with JFET AGC, 1 kHz or 400 Hz by link, 0/+4/+8 dBu, four balanced outputs and a \u221260 dBm mic output. Its board was found misfiled in a SerialBox folder and is drawn from that Tango file; watch the oscillator start from noise and settle.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8203.png"}, "m8204": {"id": "m8204", "name": "M8204 \u00b7 Dual 1\u00d74 analog audio DA (1999|32)", "product": "M8204", "year": 1999, "family": "8200 Distribution Series", "summary": "Two low-noise analog distribution amplifiers on one MF82 card, each one balanced input to four balanced outputs, with on-board jumpers for stereo, mono or mix. The board is rendered from the ISS8 Gerbers and the circuit is worked out from the ISS7 netlist.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8204.png"}, "m8205": {"id": "m8205", "name": "M8205 \u00b7 Mono 1\u00d78 analog audio DA (1997|30)", "product": "M8205", "year": 1997, "family": "8200 Distribution Series", "summary": "A single-channel, low-noise analog distribution amplifier for the MF82 frame: one balanced input to eight balanced outputs, 600 \u03a9 (M8205) or 60 \u03a9 (M8205B). The board is drawn from the 14-310 Tango file and the schematic from M8205B8.DWG; drive the multi-turn SENSITIVITY, null the hum, short an output.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8205.png"}, "m8206": {"id": "m8206", "name": "M8206 \u00b7 Matrixing analog audio DA, 2 \u2192 6 (1998|31)", "product": "M8206", "year": 1998, "family": "8200 Distribution Series", "summary": "A matrixing distribution amplifier: two low-noise preamplifiers (\u22126 to +30 dB) summed in proportion to six balanced outputs, for example a mono sum of a stereo pair. No board survives, so the card is drawn as an outline; the model shows sums, polarity errors and the 600/60 \u03a9 versions.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8206.png"}, "m8207": {"id": "m8207", "name": "M8207 \u00b7 DA compressor / limiter (1995|28)", "product": "M8207", "year": 1995, "family": "8200 Distribution Series", "summary": "An analog distribution-amplifier compressor/limiter for the MF82 frame, identified from its 1995 AutoCAD drawings: a DBX 2151 gain-reduction element driven by a compressor (threshold, slope) and a fast-attack, 2.2 s-release limiter. Hit it with a tone burst and watch one second of gain reduction.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8207.png"}, "m8208": {"id": "m8208", "name": "M8208 \u00b7 Remote-level analog audio DA (1998|31)", "product": "M8208", "year": 1998, "family": "8200 Distribution Series", "summary": "A single-channel analog DA whose gain is set by a remote 5 k\u03a9 pot over 65 dB through a DBX 2151 VCA. The board is drawn from the shared 14-278 Tango files and the schematic from the 1996 AutoCAD sheets; fade the remote, trim the VCA and compare it with its compressor twin, the M8207.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8208.png"}, "m8209": {"id": "m8209", "name": "M8209 \u00b7 2-channel balanced analog DA (2005|38)", "product": "M8209", "year": 2005, "family": "8200 Distribution Series", "summary": "A two-channel balanced line amplifier for the 8200 frames: NE5532 inputs with level and CMR trims, TIP29/TIP30 push-pull drivers and a 64.4 \u03a9 build-out on each output. Silk-screened MODE links make it stereo, mono (one input to both outputs) or a mix of the two.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8209.png"}, "m8251": {"id": "m8251", "name": "M8251 \u00b7 1\u00d78 analog video DA (1997|30)", "product": "M8251", "year": 1997, "family": "8200 Distribution Series", "summary": "A one-in, eight-out analog video DA for the 8200 frames: a high-impedance looping input, one Elantec EL2099C driving eight 75 \u03a9 back-matched outputs, a LEVEL and a RESPONSE trim, and its own \u00b111.4 V regulators. The Tango board, OrCAD sheet and manual date from 1997\u20132002|30\u201335.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8251.png"}, "m8252": {"id": "m8252", "name": "M8252 \u00b7 Equalizing/clamping video DA (1997|30)", "product": "M8252", "year": 1997, "family": "8200 Distribution Series", "summary": "The cable-equalizing, hum-clamping version of the M8251 video DA. It keeps the M8251\u2019s EL2099 output stage and eight 75 \u03a9 outputs and adds an OPA650 equaliser and an LM1881-keyed back-porch clamp. Laid out in Tango in Nov 1997|30; the OrCAD sheet titled \u201cANALOG VIDEO DA \u2014 EQULIZING/CLAMPING\u201d was revised in 2001|34.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m8252.png"}, "mf8212-frame": {"id": "mf8212-frame", "name": "MF8212 Frame \u00b7 12-slot MF82-12 rack frame built from its BOM (2013|46)", "product": "MF8212 Frame", "year": 2013, "family": "8200 Distribution Series", "summary": "The 2-RU, 12-slot MF82-12 frame as its 2013|46 Misys BOMs and the 2016|49 mechanical drawings define it: assemble it part by part, cost it, load it with cards and watch two \u00b122 V supplies share the load mains cycle by mains cycle. Front, rear and side are drawn to scale from the MF8212RM1, 82-002, 82-004 and 82-072 drawings.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: build & commission"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Power path"], ["bom", "BOM & cost"], ["drawings", "Drawing set"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mf8212-frame.png"}, "mfxx": {"id": "mfxx", "name": "MFXX DA frame \u00b7 MF82 frame engineering collection (1994|27\u20132013|46)", "product": "MFXX DA frame", "year": 2000, "family": "8200 Distribution Series", "summary": "The working engineering set behind every MF82 frame: the 4-slot MF82-4 with its own LM317/LM337 supply, the MF8210 and MF8212, the MF82E/S stereo frame and its manual, the D8212F transition backplane and the MF-REF frame-reference board. Compare the frames, strap the supply, route a position through MF8212TR and send an AES or video reference down the frame.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: MF82E/S setup"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics (redrawn)"], ["software", "Signal & power path"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/mfxx.png"}, "tb8201a": {"id": "tb8201a", "name": "TB8201A \u00b7 screw-terminal dual-input \u00d7 8 termination (2005|38)", "product": "TB8201A", "year": 2005, "family": "8200 Distribution Series", "summary": "Fixed screw-terminal rear module with inputs A and B and eight balanced outputs on two 9-way blocks (+ column, \u2212 column; 1\u20134 for A, 4\u20131 for B). Copper-for-copper it has the same contact map as the pluggable TB8201AP, including the 2-way H2 header for the eighth output.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: wiring the TB8201A"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no logic)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/tb8201a.png"}, "tb8201ap": {"id": "tb8201ap", "name": "TB8201AP \u00b7 pluggable dual-input \u00d7 8 termination (2005|38)", "product": "TB8201AP", "year": 2005, "family": "8200 Distribution Series", "summary": "Pluggable screw-terminal rear module with two balanced inputs and eight balanced outputs on ten 3-way Phoenix blocks, for the D8204C and D8201A (and wired to a D8204A). Passive: each block goes straight to its own card contacts, the eighth output via a separate 2-way header.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: wiring the TB8201AP"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no logic)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/tb8201ap.png"}, "tb8202": {"id": "tb8202", "name": "TB8202 \u00b7 M8202 screw-terminal termination (1998|31)", "product": "TB8202", "year": 1998, "family": "8200 Distribution Series", "summary": "Rear termination for the M8202 remote-sensitivity analog DA: balanced input, eight 60 \u03a9 splits and the REM IN terminals for a 10 k remote pot. Seven of the eight splits share one card driver through per-leg build-out resistors on the module; OUT 4 is wired straight to a second card driver.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: wiring the TB8202"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no logic)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/tb8202.png"}, "tb8204": {"id": "tb8204", "name": "TB8204 \u00b7 M8204 dual 1\u00d74 termination, screw and pluggable (1997|30)", "product": "TB8204", "year": 1997, "family": "8200 Distribution Series", "summary": "Rear module for the M8204 dual-channel analog DA: A and B balanced inputs and four balanced outputs per channel. Outputs 1\u20133 of each channel share one card driver through 30 \u03a9 per-leg build-outs on the module; output 4 has its own contacts. Two generations: the 1997 Tango screw board and the 2001 pluggable TB8204P (P-CAD netlist).", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: wiring the TB8204"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no logic)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/tb8204.png"}, "tb8205": {"id": "tb8205", "name": "TB8205 \u00b7 single-input \u00d7 8 output termination (1997|30)", "product": "TB8205", "year": 1997, "family": "8200 Distribution Series", "summary": "Passive rear module for the single-input 8200 cards (M8205/M8205B, M8203, D8201, D8202, D8203, D8205\u2013D8207/110): a balanced input, eight balanced output pairs and, from ISS.2, a passive input loop. No parts but terminals: each output goes straight to its own pair of card contacts.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: wiring the TB8205"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Signal path (no logic)"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/tb8205.png"}, "aa6201a": {"id": "aa6201a", "name": "AA6201A \u00b7 openGear analog audio DA with silence detection (2008|41)", "product": "AA6201A (Cobalt 9241 / Ross ADA-8404-C)", "year": 2008, "family": "openGear", "summary": "A two-input, eight-output openGear analog audio DA whose AT90CAN128 only sets the routing (Stereo, Mono Mix, Mono DA) through two 74HC4053s and watches two rectified detector voltages to report silence. The v5.01 firmware is modelled pass by pass: ADC state machine, silence timers, DashBoard over CAN, the \u201ccal\u201d/\u201cfin\u201d calibration and the SNMP strings, on the real ISS5 gerber artwork.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: install and calibrate"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/aa6201a.png"}, "av6201": {"id": "av6201", "name": "AV6201 \u00b7 openGear analog video DA (2008|41)", "product": "AV6201", "year": 2008, "family": "openGear", "summary": "openGear composite-video distribution amplifier (sold as AV6201A and Cobalt 9231): differential input, GB4571 clamp, two-stage cable equaliser, eight 75 \u03a9 outputs. An AT90CAN128 busy-waits on an LMH1981 sync separator once per field and reports to DashBoard over CAN. Modelled pass by pass from the V101 firmware and the ISS3 netlist.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/av6201.png"}, "av6201a": {"id": "av6201a", "name": "AV6201A \u00b7 analog video DA with differential input, clamp and EQ, openGear (2008|41)", "product": "AV6201A", "year": 2008, "family": "openGear", "summary": "openGear composite-video distribution amplifier: differential input, back-porch clamp, 0\u2013300 m cable EQ, \u00b13 dB level, eight 75 \u03a9 outputs (Cobalt 9231 / Ross ADC-8432). This folder holds the ISS3/ISS4 production files; the model uses the V101 firmware and P-CAD netlist from the sibling AV6201 folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/av6201a.png"}, "av6202": {"id": "av6202", "name": "AV6202 \u00b7 utility analog video DA with frame-reference input, openGear (2009|42)", "product": "AV6202", "year": 2009, "family": "openGear", "summary": "Composite-video DA (OEM Cobalt 9233): one differential input \u2014 or a frame reference for black burst \u2014 to eight 75 \u03a9 outputs, with an LMH1981 sync separator and an AT90CAN128 reporting Video Status to DashBoard (SNMP from V200, 2012|45). Simulated from the V101/V200 firmware, the ISS1\u2013ISS3 netlists and ECOs, and the ISS3 gerbers.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, field by field"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/av6202.png"}, "av6202a": {"id": "av6202a", "name": "AV6202A \u00b7 utility analog video DA with frame-reference input, openGear (2009|42)", "product": "AV6202A", "year": 2009, "family": "openGear", "summary": "Utility composite-video DA (Cobalt 9233): one input \u2014 rear BNC or frame reference \u2014 to eight 75 \u03a9 outputs with \u00b13 dB level, no EQ or clamp. This folder holds only the test report; the model uses the V200 firmware, MIB and netlist from the sibling AV6202 folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/av6202a.png"}, "d6201": {"id": "d6201", "name": "D6201 \u00b7 openGear 75 \u03a9 AES DA, engineering parent of the D6201A/B (2008|41)", "product": "D6201", "year": 2008, "family": "openGear", "summary": "The engineering parent of the D6201A (1\u00d78) and D6201B (dual, 2\u00d74 or 1\u00d78 with SRC) openGear AES distribution amplifiers: one ISS5 board, two firmware builds. The model runs the real V1.04 / V1.02\u2013V1.03 code paths \u2014 AT90CAN128 super-loop, bit-banged CS8416 and FPGA control, DashBoard over CAN \u2014 on the card drawn from its gerbers.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6201.png"}, "d6201a": {"id": "d6201a", "name": "D6201A \u00b7 1\u00d78 75 \u03a9 AES distribution amplifier, openGear (2008|41)", "product": "D6201A", "year": 2008, "family": "openGear", "summary": "openGear card that equalises and reclocks one 75 \u03a9 AES3 input and drives eight outputs (Ross ADA-8401-A / Cobalt 9251). This folder holds only ISS5 production files; the model runs the V104 firmware and FPGA from the sibling D6201 engineering folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6201a.png"}, "d6201b": {"id": "d6201b", "name": "D6201B \u00b7 dual 75 \u03a9 AES distribution amplifier with SRC, openGear (2008|41)", "product": "D6201B", "year": 2008, "family": "openGear", "summary": "Dual-input openGear AES3 DA (Cobalt 9253): 1\u00d78, dual 1\u00d74, or 1\u00d78 through an AD1895 sample-rate converter locked to a reference on input 2 or the frame REF. Built on the D6201A ISS5 board; the model runs the V102/V103 firmware from the sibling D6201 engineering folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6201b.png"}, "d6202a": {"id": "d6202a", "name": "D6202A \u00b7 openGear 1\u00d78 110 \u03a9 AES DA (2008|41)", "product": "D6202A", "year": 2008, "family": "openGear", "summary": "The D6202A openGear AES distribution amplifier (Ross ADA-8401-B / Cobalt 9252) modelled from its v104 firmware, ISS3 netlist and the D6201B FPGA image: transformer input with switchable cable EQ, a CS8416 receiver, an FPGA that re-times and mutes, and eight transformer-coupled 110 \u03a9 outputs. The card is drawn from the ISS4 gerbers and driven through its EQ button, termination jumper, rear modules and a DashBoard-style window; an FPGA switch compares the Altera EP1C3 image with the two Lattice LFXP3 bitstreams.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6202a.png"}, "d6202b": {"id": "d6202b", "name": "D6202B \u00b7 dual-input 110 \u03a9 balanced AES distribution amplifier, openGear (2009|42)", "product": "D6202B", "year": 2009, "family": "openGear", "summary": "Dual-input, transformer-coupled 110 \u03a9 AES3 DA on the D6202A ISS3/ISS4 board: 1\u00d78, 2\u00d74, or 1\u00d78 through an AD1895 sample-rate converter that follows input 2 or the frame reference. The model runs the V100 firmware (a renamed copy of the D6201B V102 code) on the card drawn from its real gerbers.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6202b.png"}, "d6203": {"id": "d6203", "name": "D6203 \u00b7 D6203A stereo A-to-AES converter: pick-and-place programs (2008|41)", "product": "D6203", "year": 2008, "family": "openGear", "summary": "This folder holds only the issue 2 and issue 3 pick-and-place programs for the D6203A openGear analog-to-AES converter. The plugin draws the board from those placements and runs the card itself (AK5394A, reference fallback, CAL) from the V104 firmware in the sibling D6203A folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["pnp", "Placement (PNP)"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6203.png"}, "d6204": {"id": "d6204", "name": "D6204 \u00b7 AES-to-analog D/A converter, openGear (2008|41)", "product": "D6204", "year": 2008, "family": "openGear", "summary": "The D6204A turns one 75 \u03a9 AES3 input into two balanced stereo analog pairs and four AES outputs (Ross DAC-8416 / Cobalt 9262). This model runs the V200 AVR firmware and the D6201A-derived FPGA, on the real ISS4 board drawn from its Gerbers. It also settles which of the duplicated #PROBLEM folders is authoritative.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6204.png"}, "d6204a": {"id": "d6204a", "name": "D6204A \u00b7 AES-to-analog converter, openGear: manual and drawings (2007|40)", "product": "D6204A", "year": 2007, "family": "openGear", "summary": "The D6204A turns one 75 \u03a9 AES3 input into two balanced analog stereo pairs (+24 dBu max) plus four AES outputs (Ross DAC-8416 / Cobalt 9262). This folder holds the manual, specs and drawings; the model runs the V200 firmware from the duplicated D6204 #PROBLEM engineering tree.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6204a.png"}, "d6207a-docs": {"id": "d6207a-docs", "name": "D6207A docs \u00b7 Dolby E / AC-3 decoder register map and SNMP MIB, openGear (2007|40)", "product": "D6207A docs (TIM)", "year": 2007, "family": "openGear", "summary": "Documents for the D6207A openGear Dolby E / AC-3 decoder (Ross DED-8420): the AVR \u21c4 FPGA register map in two versions, the SNMP MIB and its design note, and the card-edge and T6305 drawings. The model drives the live register map and MIB from a decoder simulation and checks them against the V102 firmware in the sibling Master folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6207a-docs.png"}, "d6207a": {"id": "d6207a", "name": "D6207A \u00b7 openGear Dolby E / AC-3 decoder, Ross DED-8420 (2008|41)", "product": "D6207A", "year": 2008, "family": "openGear", "summary": "The D6207A openGear decoder card (sold as Ross DED-8420): two AES inputs, an EP1C12 that finds SMPTE 337 bursts and routes them to a plug-in CAT552 decoder module, and an AT90CAN128 running the V102 or V201 firmware. The model runs main() pass by pass from power-up, with the real ISS2 board artwork, the DIP switch, DashBoard and the T6305 rear module.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6207a.png"}, "d6208": {"id": "d6208", "name": "D6208 \u00b7 D6208A eight-input Dolby decoder, PCB issue 1 (2010|43)", "product": "D6208", "year": 2010, "family": "openGear", "summary": "Unreleased openGear design: eight AES inputs, each with a CS8416 receiver and AD1895 SRC, an EP2C35 FPGA, a CAT-559 Dolby decoder module and video genlock. Only the issue-1 P-CAD files exist; the model is built from the netlist and its ECO log, with no firmware.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6208.png"}, "d6208a": {"id": "d6208a", "name": "D6208A \u00b7 2007 schematic: a D6207A-based Dolby decoder layout, openGear (2007|40)", "product": "D6208A", "year": 2007, "family": "openGear", "summary": "This folder\u2019s D6208A.sch is really the D6207A dual-input Dolby decoder platform saved under the D6208A number: two AES inputs, CS8416 receivers, an EP1C12 FPGA and a CAT552 decoder socket feeding six AES outputs. The model runs that platform as design intent and compares the three designs that share the D6208A name.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/d6208a.png"}, "m6201": {"id": "m6201", "name": "M6201 \u00b7 embedded audio AGC card, openGear: engineering design (2008|41)", "product": "M6201", "year": 2008, "family": "openGear", "summary": "The M6201 was designed as an \u201cEmbedded Audio AGC\u201d: de-embed SDI audio, level it with AGC, compressor, gate and leveller in a SHARC DSP, and re-embed it, with an optional Dolby decoder and optional video delay in DDR memory. Only the functional drawing and the P-CAD design survive; the model runs the idea with design-intent controls.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6201.png"}, "m6202": {"id": "m6202", "name": "M6202 \u00b7 openGear HD/SD-SDI AES de-embedder with Dolby E / AC-3 decoder (2008|41)", "product": "M6202", "year": 2008, "family": "openGear", "summary": "The openGear twin of the POD31: an EP1C12 de-embeds SD/HD-SDI audio groups to six AES outputs and routes one pair through a plug-in decoder module (CAT No. 552) for Dolby E or AC-3. The model runs the AT90CAN128 firmware (M6202AE v2.02, with the unreleased M6202A v1.04 for comparison) against SDI lines, HANC packets, SMPTE 337 bursts and the CAT552 reset line, on the real ISS3 gerber artwork with a DashBoard-style panel.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6202.png"}, "m6202a": {"id": "m6202a", "name": "M6202A \u00b7 MD-SDI embedded audio demultiplexer, openGear: release package (2008|41)", "product": "M6202A", "year": 2008, "family": "openGear", "summary": "The M6202A de-embeds two selected audio groups from SD/HD-SDI to four AES outputs and flags embedded Dolby E / AC-3. This release folder holds only the ISS3 Gerbers; the model runs firmware 1.0.0.3 (and 1.0.0.2 for comparison) from the M6202 engineering folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6202a.png"}, "m6202ae": {"id": "m6202ae", "name": "M6202AE \u00b7 MD-SDI audio demultiplexer with Dolby decoding, openGear: test release (2009|42)", "product": "M6202AE", "year": 2009, "family": "openGear", "summary": "The M6202AE de-embeds SDI audio to six AES outputs and decodes embedded Dolby E / Dolby Digital to eight channels with an Lt/Rt downmix and metadata output. This folder holds the scanned v2.02 test outline; the model routes by the manual\u2019s DIP and Table 2 and runs the outline against itself.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6202ae.png"}, "m6203": {"id": "m6203", "name": "M6203 \u00b7 openGear SD/HD/3G reclocking SDI DA (2007|40)", "product": "M6203", "year": 2007, "family": "openGear", "summary": "A 1-in, 8-out openGear SDI distribution amplifier: GS2974A equaliser, GS2975A multi-rate reclocker (ASI too) and four GS2978 drivers, with an AT90CAN128 that debounces the reclocker\u2019s LOCKED pin, lights the rate LEDs, mutes and disables the outputs, and reports to DashBoard. Modelled down to SDI frames, lines, words and bits, the reclocker\u2019s rate search and every main-loop pass.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: install, lock, DashBoard"], ["second", "One second: frames \u2192 bits"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6203.png"}, "m6203a": {"id": "m6203a", "name": "M6203A \u00b7 SDI reclocking distribution amplifier, openGear: release package (2010|43)", "product": "M6203A", "year": 2010, "family": "openGear", "summary": "The M6203A reclocks one SD/HD/3G-SDI input to eight outputs (GS2974A EQ, GS2975A reclocker, four GS2978 drivers). This release folder holds the ISS3 Gerbers and the test department\u2019s reports; the model runs the v1.01 firmware from the M6203 engineering folder against the measured cable reach.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6203a.png"}, "m6204": {"id": "m6204", "name": "M6204A \u00b7 openGear HD/SD-SDI 4-group AES embedder (2009|42)", "product": "M6204A", "year": 2009, "family": "openGear", "summary": "openGear card that embeds up to four groups of audio into HD/SD-SDI: eight external AES inputs (CS8416 receivers, AD1895 rate converters) or the incoming embedded pairs, chosen per AES pair, are written into the HANC by a Cyclone II EP2C35. An AT90CAN128 running Ward-Beck\u2019s own main loop reads the receivers and a 128-bit FPGA status word, drives twelve LEDs and talks to DashBoard; an M6204AE variant carries a CAT-559 Dolby encoder module.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up an embedder"], ["second", "One second, down to HANC packets"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6204.png"}, "m6204a": {"id": "m6204a", "name": "M6204A \u00b7 HD/SD-SDI AES audio embedder, openGear: test reports and PNP (2009|42)", "product": "M6204A", "year": 2009, "family": "openGear", "summary": "The M6204A embeds up to eight external AES inputs into an SD/HD-SDI signal, cascading or replacing each embedded pair, with sample-rate conversion that coded audio bypasses. This folder holds the test reports and the issue-3 pick-and-place program; the model runs firmware 3.0.0.0 from the M6204 engineering folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6204a.png"}, "m6205": {"id": "m6205", "name": "M6205 \u00b7 openGear SDI embedded audio processor (2008|41)", "product": "M6205", "year": 2008, "family": "openGear", "summary": "openGear card that de-embeds the audio from SD/HD-SDI, processes it and re-embeds it. Three processors share the work: an AT90CAN128, an EP2C35 FPGA and an ADSP-21262 SHARC. Modelled on the CTV M6205A-C200 3.0.0.1 build (DV / programme-mono and metadata-driven mixdown); the many customer variants, including the 3G v6xx builds on the Ross zeuslib scheduler, are on a selector.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: setting up the C200"], ["second", "One second, field by field"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6205.png"}, "m6205-3g": {"id": "m6205-3g", "name": "M6205-3G \u00b7 3G/HD/SD-SDI audio processor with DTS NLC (2010|43)", "product": "M6205-3G", "year": 2010, "family": "openGear", "summary": "The openGear M6205A-3G de-embeds up to 16 channels from 3G, HD or SD-SDI, routes them with two AES inputs through a plug-in DTS or Dolby daughter card, and re-embeds them on two SDI outputs and four AES outputs. This model runs the 2011 DTS NLC 5.1 firmware (gearOS on an AT90CAN128) against a model of the Cyclone II register file, the Gennum GS2970/GS2962 and the DaySequerra card protocol.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6205-3g.png"}, "m6205c": {"id": "m6205c", "name": "M6205C \u00b7 customer builds of the MD-SDI embedded audio processor, openGear: sales and manual (2008|41)", "product": "M6205C", "year": 2008, "family": "openGear", "summary": "The M6205C/CE builds are the M6205 SDI audio processor with one firmware per customer: metadata downmix (C100), described-video mix (C200), Dolby decoding (CE300/CE400), external AES embedding (C500) and plain re-embedding (C600). This folder holds DashBoard screenshots and the CE V3.00 manual; the model switches builds and follows their routing rules.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6205c.png"}, "m6206": {"id": "m6206", "name": "M6206A \u00b7 SDI de-embedder with Dolby decode and voice-over mixing (2007|40)", "product": "M6206A", "year": 2007, "family": "openGear", "summary": "openGear card made for Astral Media: an EP1C12 FPGA de-embeds one SDI audio group and feeds the Dolby E/AC-3 pair to a CAT552 decoder, an ADSP-21262 SHARC mixes an announcer\u2019s voice-over into the decoded L/R(/C) and the PCM pair while ramping the programme down, and an AT90CAN128 runs the GPI state machine, LEDs and DashBoard. Modelled pass by pass from the v1.04 AVR code, the SHARC sample interrupt and the FPGA detectors, on the real ISS1 gerber artwork.", "depth": "Full model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: voice-over operation"], ["second", "One second, frame by frame"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6206.png"}, "m6206a": {"id": "m6206a", "name": "M6206A \u00b7 SDI audio demuxer with Dolby decoding and voice-over, openGear: production package (2007|40)", "product": "M6206A", "year": 2007, "family": "openGear", "summary": "The M6206A de-embeds an SDI audio group, decodes an embedded Dolby stream to 5.1 and mixes a voice-over into the programme with a ramped dim, under GPI control. This folder holds the pick-and-place programs (drawn here part by part) and a stray copy of the M6245A power board; the model runs the v1.04 AVR and v102 SHARC code from the M6206 engineering folder.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial"], ["second", "One second"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Software"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6206a.png"}, "m6245a": {"id": "m6245a", "name": "M6245A \u00b7 frame PSU interface and monitor board (2007|40)", "product": "M6245A", "year": 2007, "family": "openGear", "summary": "Power-bay board for the MF6220 openGear frame: passes AC to a 12.5 V brick, ORs its output onto +12 V, makes \u22127.5 V with a PTN78020A wired as an inverter, and reports temperature, fan and current to the frame controller over 1-Wire (DS2438).", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: bench-testing the M6245A"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "1-Wire protocol"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/m6245a.png"}, "t6201": {"id": "t6201", "name": "T6201 \u00b7 10-BNC openGear rear module (2006|39)", "product": "T6201", "year": 2006, "family": "openGear", "summary": "First-generation Ward-Beck openGear rear module: ten BNCs, each through a 4n7 series inductor to the standard MEC1 pins, with isolated shells on positions 1, 2, 9 and 10. Passive; the card reads its type from two ID resistors (3K57 / 30K9).", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6201"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6201.png"}, "t6202": {"id": "t6202", "name": "T6202 \u00b7 BNC + terminal-block openGear rear module (2008|41)", "product": "T6202", "year": 2008, "family": "openGear", "summary": "Ward-Beck openGear rear module that mixes BNCs with Phoenix terminal blocks. ISS1 (2006|39) had 5 BNC + 5 TB; ISS2\u2013ISS4 (to 2008|41) became 6 BNC + 4 TB, net-for-net the same as a T6302 but still with the 15K type resistor.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6202"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6202.png"}, "t6203": {"id": "t6203", "name": "T6203 \u00b7 10 terminal-block openGear rear module (2008|41)", "product": "T6203", "year": 2008, "family": "openGear", "summary": "Ten Phoenix pluggable terminal blocks for 110 \u03a9 AES or balanced analog audio, wired to the openGear AES pairs. ISS2 (2008|41) moved the two single-ended BNC pin pairs from positions 9\u201310 to 1\u20132 so a card can take a balanced input there, without changing the 9K76 ID.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6203"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6203.png"}, "t6204": {"id": "t6204", "name": "T6204 \u00b7 2 BNC + 8 terminal-block openGear rear module (2006|39)", "product": "T6204", "year": 2006, "family": "openGear", "summary": "Two BNCs on top for 75 \u03a9 inputs or SDI, eight Phoenix terminal blocks for balanced AES or audio outputs. The ISS1 board left its ID resistor value blank and had no AN_BMID2 resistor at all; ISS2 adds the allocated 6K98.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6204"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6204.png"}, "t6301": {"id": "t6301", "name": "T6301 \u00b7 10-BNC openGear rear module (2008|41)", "product": "T6301", "year": 2008, "family": "openGear", "summary": "The most used Ward-Beck openGear rear: ten BNCs for one card. ISS4 (2008|41) puts a 4n7 inductor in series with every BNC and 75 \u03a9 across seven of them for SDI return loss, and AC-couples the four isolated input shells to ground.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6301"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t6301.png"}, "t6302": {"id": "t6302", "name": "T6302 \u00b7 6 BNC + 4 terminal-block openGear rear module (2009|42)", "product": "T6302", "year": 2009, "family": "openGear", "summary": "Single-card rear for the D6203A A/D and D6204A D/A converters: six BNCs for AES and reference, four Phoenix blocks for balanced analog audio. ISS3 (2009|42) adds 75 \u03a9 across the series inductors on four BNCs; ISS1 wired positions 9\u201310 to single-ended pins.", "depth": "Hardware model", "tabs": [["sim", "Simulator"], ["tutorial", "Tutorial: fitting the T6302"], ["second", "One second, slow motion"], ["block", "Block diagram"], ["schematic", "Schematics"], ["software", "Card-side ID code"], ["findings", "Findings"]], "preview": "siumulation-plugins/previews/t630
